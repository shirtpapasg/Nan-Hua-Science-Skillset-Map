ributes.position;\n    p.setXYZ(0,t1.x,t1.y,t1.z);p.setXYZ(1,t2.x,t2.y,t2.z);p.needsUpdate=true;\n  });\n  const vw=window.innerWidth-220,vh=window.innerHeight;\n  labelEls.forEach(({el,mesh})=>{\n    const p=mesh.position.clone().project(camera);\n    if(p.z>=1){el.style.display='none';return;}\n    el.style.left=((p.x*.5+.5)*vw+220)+'px';\n    el.style.top =((-p.y*.5+.5)*vh+16)+'px';\n    el.style.display='block';\n  });\n  updateHierarchyLabelPositions();\n}\n\nfunction buildHierarchyLabels(){\n  const container=document.getElementById('hier-labels');\n  container.innerHTML='';\n  TIERS.forEach((tier,i)=>{\n    const el=document.createElement('div');\n    el.className='tier-label';\n    el.id='tlabel-'+i;\n    el.textContent=tier.label;\n    el.style.borderColor=tier.color+'88';\n    el.style.color=tierCol(tier);\n    el.dataset.tierIdx=i;\n    container.appendChild(el);\n  });\n  document.getElementById('hier-legend').innerHTML=\n    TIERS.map((t,i)=>`<div class=\"tier-row\">\n      <div class=\"tier-dot\" style=\"background:${t.color};box-shadow:0 0 4px ${t.color};\"><\u002Fdiv>\n      <div class=\"tier-name\" style=\"color:${tierCol(t)};\">${t.label}<\u002Fdiv>\n      <div class=\"tier-rank\">${i+1}<\u002Fdiv>\n    <\u002Fdiv>`).join('');\n  updateHierarchyLabelPositions();\n}\n\nfunction updateHierarchyLabelPositions(){\n  const showHier=groupBy==='hierarchy';\n  document.getElementById('hier-labels').style.display=showHier?'block':'none';\n  if(!showHier) return;\n  const vh=window.innerHeight;\n  TIERS.forEach((tier,i)=>{\n    const el=document.getElementById('tlabel-'+i);\n    if(!el) return;\n    const worldPt=new THREE.Vector3(-85,getTierY(i),0);\n    const proj=worldPt.project(camera);\n    const sy=(-proj.y*.5+.5)*vh;\n    el.style.top=sy+'px';\n  });\n}\n\n// ================================================================\n// RAYCASTER\n// ================================================================\nconst raycaster=new THREE.Raycaster();\nconst mouse=new THREE.Vector2();\n\ncanvas.addEventListener('mousemove',e=>{\n  const rect=canvas.getBoundingClientRect();\n  mouse.x=((e.clientX-rect.left)/rect.width)*2-1;\n  mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;\n  raycaster.setFromCamera(mouse,camera);\n  const hits=raycaster.intersectObjects(nodeMeshes.map(n=>n.mesh));\n  const tip=document.getElementById('tooltip');\n  if(hits.length){\n    const t=teachers.find(t=>t.id===hits[0].object.userData.id);\n    if(t){\n      canvas.style.cursor='pointer';tip.style.display='block';\n      tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY-10)+'px';\n      const pts=getTotalPts(t);\n      tip.innerHTML=`<strong style=\"color:#fff\">${t.name}<\u002Fstrong> · ${t.subject}<br><span style=\"color:#445577\">${t.role}<\u002Fspan><br><span style=\"color:var(--cyan)\">⬡ ${pts} pt${pts!==1?'s':''}<\u002Fspan>`;\n    }\n  } else {canvas.style.cursor='default';tip.style.display='none';}\n});\ncanvas.addEventListener('mouseleave',()=>{document.getElementById('tooltip').style.display='none';});\ncanvas.addEventListener('click',e=>{\n  if(wasDragging){wasDragging=false;return;}\n  raycaster.setFromCamera(mouse,camera);\n  const hits=raycaster.intersectObjects(nodeMeshes.map(n=>n.mesh));\n  if(hits.length){const t=teachers.find(t=>t.id===hits[0].object.userData.id);if(t)focusTeacher(t.id);}\n  else clearFocus();\n});\n\n// ================================================================\n// FOCUS MODE\n// ================================================================\nfunction focusTeacher(id){\n  focusedId=id;\n  const teacher=teachers.find(t=>t.id===id); if(!teacher) return;\n  const connIds=new Set(getConnections(teacher).map(c=>c.id));\n  nodeMeshes.forEach(({mesh,teacher:t})=>{\n    const isFocus=t.id===id,isConn=connIds.has(t.id);\n    mesh.material.opacity=isFocus?1:(isConn?.88:.07);\n    mesh.material.emissiveIntensity=isFocus?1.3:(isConn?.42:.03);\n    if(isFocus){mesh.material.emissive=new THREE.Color(0xffffff);setTimeout(()=>{mesh.material.emissive=new THREE.Color(getCol(t.subject).hex);},280);}\n  });\n  edgeLines.forEach(l=>{const inv=l.userData.t1===id||l.userData.t2===id;l.material.opacity=inv?.88:.02;});\n  labelEls.forEach(({el,teacher:t})=>{el.style.opacity=(t.id===id||connIds.has(t.id))?'1':'.12';el.style.fontWeight=t.id===id?'700':'400';});\n  showInfoPanel(teacher,getConnections(teacher));\n  if(typeof layout!=='undefined' && layout==='board') renderBoard();\n}\nwindow.focusTeacher=focusTeacher;\n\nfunction clearFocus(){\n  focusedId=null;\n  nodeMeshes.forEach(({mesh,teacher:t})=>{mesh.material.opacity=1;mesh.material.emissiveIntensity=0.42;mesh.material.emissive=new THREE.Color(getCol(t.subject).hex);});\n  edgeLines.forEach(l=>{const s=getEdgeStyle(teachers.find(t=>t.id===l.userData.t1),teachers.find(t=>t.id===l.userData.t2));l.material.opacity=s?s.opacity:0.2;});\n  labelEls.forEach(({el})=>{el.style.opacity='.85';el.style.fontWeight='600';});\n  document.getElementById('info-panel').classList.remove('open');\n  if(typeof layout!=='undefined' && layout==='board') renderBoard();\n}\nwindow.clearFocus=clearFocus;\n\n// ================================================================\n// INFO PANEL  (activities = primary info at top, all clickable)\n// ================================================================\nfunction showInfoPanel(teacher,connections){\n  if(teacher.kind==='activity') return showActivityPanel(teacher,connections);\n  if(teacher.kind==='wotd')     return showWotdPanel(teacher,connections);\n  return showCompetencyPanel(teacher,connections);\n}\n\n// ---------- ACTIVITY VIEW PANEL ----------\nfunction showActivityPanel(node,connections){\n  const a=getAct(node.actId); const panel=document.getElementById('info-panel');\n  const col=getCol(node.subject);\n  const comps=actCompetencies(node.actId);\n  const skills=actWotdNames(node.actId).map(n=>wotdByName(n)).filter(Boolean);\n  const loaded=a&&BOOKS[a.level]&&BOOKS[a.level].doc;\n  const isCfu=!!cfuQuestions(node.actId);\n  panel.innerHTML=`\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;\">\n      <div style=\"flex:1;min-width:0;\">\n        <div class=\"subject-badge\" style=\"background:${col.css}1a;border-color:${col.css}88;color:${txtCol(node.subject)};margin-bottom:6px;\">\n          <div style=\"width:6px;height:6px;border-radius:50%;background:${col.css};box-shadow:0 0 5px ${col.css};\"><\u002Fdiv>\n          ${a.level} · Activity ${a.code}\n        <\u002Fdiv>\n        <div class=\"info-name\">${a.code}: ${a.name}<\u002Fdiv>\n        <div style=\"font-size:12px;color:var(--text-dim);margin-top:4px;\">${a.chapter}<\u002Fdiv>\n      <\u002Fdiv>\n      <button class=\"close-btn\" onclick=\"clearFocus()\">✕<\u002Fbutton>\n    <\u002Fdiv>\n\n    <div class=\"info-section\" style=\"border:1px solid var(--line);border-radius:10px;padding:11px;\">\n      <div style=\"display:flex;align-items:center;gap:8px;\">\n        <div style=\"flex:1;font-size:12px;color:var(--text-mid);\">Printed p${a.printed} · PDF p${actPage(node.actId)}<\u002Fdiv>\n        <button onclick=\"openPdfModal('${node.actId}')\" style=\"background:var(--cyan-soft);border:1px solid var(--cyan);color:var(--cyan);border-radius:6px;padding:4px 12px;cursor:pointer;font-size:11px;font-family:inherit;\">📄 ${loaded?'Preview':'Book not loaded'}<\u002Fbutton>\n        <button onclick=\"editActivityPage('${node.actId}')\" title=\"Edit page number\" style=\"background:none;border:1px solid var(--line);color:var(--text-dim);border-radius:6px;padding:4px 9px;cursor:pointer;font-size:11px;\">✏<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"info-section\">\n      <div class=\"info-section-label\" style=\"display:flex;align-items:center;\">\n        <span style=\"flex:1;\">🔬 Ways of Thinking &amp; Doing ${isCfu?'· by question':'('+skills.length+')'}<\u002Fspan>\n        ${isCfu?'':`<button onclick=\"openWotdEditor('${node.actId}')\" style=\"background:none;border:1px solid var(--line);color:var(--text-dim);border-radius:5px;padding:2px 9px;cursor:pointer;font-size:10px;font-family:inherit;\">✏ Edit<\u002Fbutton>`}\n      <\u002Fdiv>\n      ${isCfu?renderCfuQuestions(node.actId,true):''}\n      ${(!isCfu&&actWotdEdited(node.actId))?'<div style=\"font-size:10px;color:#ffaa33;margin-bottom:5px;\">● edited from syllabus default<\u002Fdiv>':''}\n      ${isCfu?'':skills.length?skills.map(w=>{\n        const note=wotdNote(node.actId,w.name);\n        return `<div onclick=\"setWotdFilter('${w.name}')\" style=\"border-left:3px solid ${w.color};background:${w.color}0f;border-radius:0 7px 7px 0;padding:7px 10px;margin-bottom:5px;cursor:pointer;\">\n          <div style=\"font-size:12px;font-weight:700;color:${wotdCol(w)};\">${w.name}<\u002Fdiv>\n          ${note?`<div style=\"font-size:11px;color:var(--text-mid);margin-top:3px;line-height:1.5;\">${note}<\u002Fdiv>`:''}\n        <\u002Fdiv>`;}).join('')\n      :'<div style=\"font-size:12px;color:var(--text-faint);\">No process skills tagged. Use ✏ Edit to add.<\u002Fdiv>'}\n    <\u002Fdiv>\n\n    <div class=\"info-section\">\n      <div class=\"info-section-label\">21st CC Competencies (${comps.length})<\u002Fdiv>\n      ${comps.length?comps.map(c=>{\n        const cc=getCol(c.subject);\n        return `<div onclick=\"jumpToCompetency('${c.name}')\" style=\"display:flex;gap:8px;align-items:flex-start;padding:7px 9px;margin-bottom:5px;border-left:2px solid ${cc.css}88;background:var(--card);border-radius:0 7px 7px 0;cursor:pointer;\">\n          <div style=\"width:8px;height:8px;border-radius:50%;background:${cc.css};box-shadow:0 0 5px ${cc.css};flex-shrink:0;margin-top:3px;\"><\u002Fdiv>\n          <div style=\"flex:1;\">\n            <span style=\"font-size:13px;font-weight:700;color:${txtCol(c.subject)};\">${c.name}<\u002Fspan>\n            <div style=\"font-size:11px;color:var(--text-dim);line-height:1.5;margin-top:2px;\">${c.desc}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>`;}).join('')\n      :'<div style=\"font-size:12px;color:var(--text-faint);\">Not mapped to a competency yet.<\u002Fdiv>'}\n    <\u002Fdiv>\n\n    <div class=\"info-section\">\n      <div class=\"info-section-label\">Related activities (${connections.length})<\u002Fdiv>\n      ${connections.slice(0,14).map(c=>{\n        const ca=getAct(c.actId), cc=getCol(c.subject);\n        return `<div onclick=\"focusTeacher(${c.id})\" style=\"display:flex;align-items:center;gap:7px;padding:4px 7px;margin-bottom:3px;border-radius:6px;cursor:pointer;background:var(--card);\">\n          <span style=\"font-size:9px;font-weight:800;color:${txtCol(c.subject)};background:${cc.css}1c;border-radius:4px;padding:1px 5px;\">${ca.level}<\u002Fspan>\n          <span style=\"flex:1;font-size:11.5px;color:var(--text-mid);\">${ca.name}<\u002Fspan>\n        <\u002Fdiv>`;}).join('')||'<div style=\"font-size:12px;color:var(--text-faint);\">None<\u002Fdiv>'}\n      ${connections.length>14?`<div style=\"font-size:10px;color:var(--text-faint);margin-top:4px;\">+${connections.length-14} more<\u002Fdiv>`:''}\n    <\u002Fdiv>`;\n  panel.classList.add('open');\n}\n\n// ---------- WOTD VIEW PANEL ----------\nfunction showWotdPanel(node,connections){\n  const w=wotdByName(node.wotdName); const panel=document.getElementById('info-panel');\n  const acts=node.projects.slice();\n  const byLevel={};\n  acts.forEach(id=>{ const a=getAct(id); if(a) (byLevel[a.level]=byLevel[a.level]||[]).push(a); });\n  panel.innerHTML=`\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;\">\n      <div style=\"flex:1;min-width:0;\">\n        <div class=\"subject-badge\" style=\"background:${w.color}1a;border-color:${w.color}88;color:${wotdCol(w)};margin-bottom:6px;\">\n          <div style=\"width:6px;height:6px;border-radius:50%;background:${w.color};box-shadow:0 0 5px ${w.color};\"><\u002Fdiv>\n          Science Process Skill\n        <\u002Fdiv>\n        <div class=\"info-name\">${w.name}<\u002Fdiv>\n        <div style=\"font-size:12px;color:var(--text-dim);margin-top:4px;line-height:1.5;\">${w.full}<\u002Fdiv>\n      <\u002Fdiv>\n      <button class=\"close-btn\" onclick=\"clearFocus()\">✕<\u002Fbutton>\n    <\u002Fdiv>\n\n    ${w.byP4?`<div class=\"info-section\"><div class=\"info-section-label\">Milestone — by end of P4<\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--text-mid);line-height:1.6;\">${w.byP4}<\u002Fdiv><\u002Fdiv>`:''}\n    ${w.byP6?`<div class=\"info-section\"><div class=\"info-section-label\">Milestone — by end of P6<\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--text-mid);line-height:1.6;\">${w.byP6}<\u002Fdiv><\u002Fdiv>`\n      :(w.byP4?`<div class=\"info-section\"><div class=\"info-section-label\">Milestone — by end of P6<\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--text-faint);line-height:1.6;font-style:italic;\">Syllabus states the same expectation at both milestones.<\u002Fdiv><\u002Fdiv>`:'')}\n    ${(()=>{ const lower=w.activities.filter(a=>/^P[34]-/.test(a)).length, upper=w.activities.filter(a=>/^P[56]-/.test(a)).length, tot=lower+upper;\n      if(!tot) return '';\n      const pct=Math.round(lower/tot*100);\n      return `<div class=\"info-section\"><div class=\"info-section-label\">Where it is practised<\u002Fdiv>\n        <div style=\"display:flex;height:7px;border-radius:4px;overflow:hidden;background:var(--card);margin-bottom:6px;\">\n          <div style=\"width:${pct}%;background:${w.color};\"><\u002Fdiv><div style=\"flex:1;background:${w.color}55;\"><\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;font-size:11px;color:var(--text-dim);\">\n          <span>P3–P4 · <b style=\"color:var(--text-mid);\">${lower}<\u002Fb><\u002Fspan><span>P5–P6 · <b style=\"color:var(--text-mid);\">${upper}<\u002Fb><\u002Fspan><\u002Fdiv><\u002Fdiv>`; })()}\n\n    <div class=\"info-section\">\n      <div class=\"info-section-label\">Activities building this skill (${acts.length})<\u002Fdiv>\n      ${['P3','P4','P5','P6'].map(lv=>{\n        const list=byLevel[lv]; if(!list||!list.length) return '';\n        const lc=lvlCol(lv);\n        return `<div style=\"margin-bottom:9px;\">\n          <div style=\"font-size:10px;font-weight:800;color:${lc};letter-spacing:.08em;margin-bottom:4px;\">${lv} · ${list.length}<\u002Fdiv>\n          ${list.map(a=>`<div onclick=\"openPdfModal('${a.id}')\" title=\"Preview page ${actPage(a.id)}\"\n            style=\"display:flex;align-items:center;gap:6px;padding:4px 8px;margin-bottom:3px;background:var(--card);border-left:2px solid ${lc}66;border-radius:0 6px 6px 0;cursor:pointer;\">\n            <span style=\"flex:1;font-size:11.5px;color:var(--text-mid);\">${a.name}<\u002Fspan>\n            <span style=\"font-size:10px;color:var(--text-faint);\">${a.code} · p${actPage(a.id)}<\u002Fspan>\n          <\u002Fdiv>`).join('')}\n        <\u002Fdiv>`;}).join('')}\n    <\u002Fdiv>\n\n    <div class=\"info-section\">\n      <div class=\"info-section-label\">Shares activities with (${connections.length})<\u002Fdiv>\n      ${connections.map(c=>{\n        const cw=wotdByName(c.wotdName);\n        const shared=node.projects.filter(x=>c.projects.includes(x)).length;\n        return `<div onclick=\"focusTeacher(${c.id})\" style=\"display:flex;align-items:center;gap:7px;padding:5px 8px;margin-bottom:3px;border-radius:6px;cursor:pointer;background:var(--card);\">\n          <span style=\"width:8px;height:8px;border-radius:50%;background:${cw.color};box-shadow:0 0 5px ${cw.color};\"><\u002Fspan>\n          <span style=\"flex:1;font-size:12px;color:${wotdCol(cw)};font-weight:600;\">${c.name}<\u002Fspan>\n          <span style=\"font-size:10px;color:var(--text-faint);\">${shared} shared<\u002Fspan>\n        <\u002Fdiv>`;}).join('')||'<div style=\"font-size:12px;color:var(--text-faint);\">None<\u002Fdiv>'}\n    <\u002Fdiv>`;\n  panel.classList.add('open');\n}\n\n// jump to a competency from another view\nwindow.jumpToCompetency=function(name){\n  if(viewMode!=='competency') setViewMode('competency');\n  const t=teachers.find(x=>x.name===name);\n  if(t) setTimeout(()=>focusTeacher(t.id),90);\n};\n\n// ---------- COMPETENCY VIEW PANEL (original) ----------\nfunction showCompetencyPanel(teacher,connections){\n  const col=getCol(teacher.subject);\n  const pts=getTotalPts(teacher), maxPts=getMaxPts();\n  const tier=TIERS[getRank(teacher.role)];\n  const panel=document.getElementById('info-panel');\n  const keyNodes=[teacher,...connections];\n\n  // count how many OTHER competencies share each activity\n  function actShareCount(actName){\n    return teachers.filter(t=>t.id!==teacher.id && t.projects.includes(actName)).length;\n  }\n\n  // render one activity pill  (p = activity id, e.g. 'P4-6.1')\n  function actPill(p, isShared){\n    const a = getAct(p);\n    const shareCount = actShareCount(p);\n    const shareLabel = shareCount>0\n      ? `<span class=\"act-pill-count\" onclick=\"event.stopPropagation();setActivityFilter('${p}')\" title=\"Show all competencies using this activity\" style=\"cursor:pointer;\">+${shareCount}<\u002Fspan>`\n      : '';\n    const lc = lvlCol(a?a.level:'');\n    const loaded = a && BOOKS[a.level] && BOOKS[a.level].doc;\n    const pdfBtn = a\n      ? `<span onclick=\"event.stopPropagation();openPdfModal('${p}')\" title=\"${loaded?'Preview page '+a.page:'Upload the '+a.level+' book to preview'}\" style=\"font-size:13px;cursor:pointer;opacity:${loaded?'.95':'.3'};margin-left:2px;\">📄<\u002Fspan>\n         <span onclick=\"event.stopPropagation();editActivityPage('${p}')\" title=\"Edit page number\" style=\"font-size:11px;cursor:pointer;opacity:.45;margin-left:1px;\">✏<\u002Fspan>`\n      : '';\n    const ws = actWotd(p);\n    const edited = actWotdEdited(p);\n    const wchips = `<div style=\"display:flex;flex-wrap:wrap;gap:3px;align-items:center;margin:1px 0 0 26px;\">\n           ${ws.map(w=>`<span onclick=\"event.stopPropagation();setWotdFilter('${w.name}')\" title=\"${w.full} — click to filter\"\n             style=\"font-size:9px;font-weight:600;color:${wotdCol(w)};background:${w.color}18;border:1px solid ${w.color}4d;border-radius:7px;padding:0 6px;cursor:pointer;\">${w.name}<\u002Fspan>`).join('')}\n           ${edited?`<span title=\"Edited from the syllabus default\" style=\"font-size:9px;color:#ffaa33;\">●<\u002Fspan>`:''}\n           <span onclick=\"event.stopPropagation();openWotdEditor('${p}')\" title=\"Edit process skills\"\n             style=\"font-size:9px;color:var(--text-faint);border:1px solid var(--line);border-radius:7px;padding:0 6px;cursor:pointer;\">✏ skills<\u002Fspan>\n         <\u002Fdiv>`;\n    return `<div style=\"margin-bottom:5px;\">\n      <div class=\"act-pill${isShared?' shared':''}\" style=\"margin-bottom:0;\" onclick=\"${a?`openPdfModal('${p}')`:''}\" title=\"${a?(loaded?'Open page '+a.page+' from the '+a.level+' book':'Load the '+a.level+' book to preview this page'):''}\">\n        <span style=\"font-size:9px;font-weight:800;color:${lc};background:${lc}1c;border:1px solid ${lc}55;border-radius:4px;padding:1px 5px;flex-shrink:0;\">${a?a.level:'?'}<\u002Fspan>\n        <span class=\"act-pill-label\">${a?a.name:p}<span style=\"color:var(--text-faint);font-size:10px;\"> · ${a?a.code:''}${a?' · p'+a.page:''}<\u002Fspan><\u002Fspan>\n        ${shareLabel}\n        ${pdfBtn}\n      <\u002Fdiv>\n      ${wchips}\n    <\u002Fdiv>`;\n  }\n\n  const sharedProjects = teacher.projects.filter(p=>connections.some(c=>c.projects.includes(p)));\n  const uniqProjects   = teacher.projects.filter(p=>!connections.some(c=>c.projects.includes(p)));\n\n  // ── HEADER ──\n  let html = `\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;\">\n      <div style=\"flex:1;min-width:0;\">\n        <div class=\"subject-badge\" style=\"background:${col.css}1a;border-color:${col.css}88;color:${txtCol(teacher.subject)};margin-bottom:6px;\">\n          <div style=\"width:6px;height:6px;border-radius:50%;background:${col.css};box-shadow:0 0 5px ${col.css};flex-shrink:0;\"><\u002Fdiv>\n          ${teacher.subject} &nbsp;·&nbsp; Tier ${getRank(teacher.role)+1}\n        <\u002Fdiv>\n        <div class=\"info-name\">${teacher.name}<\u002Fdiv>\n        ${teacher.code?`<div style=\"display:flex;align-items:center;gap:7px;margin-top:5px;\"><span style=\"font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--text-faint);\">${teacher.code}<\u002Fspan>${teacher.core?`<span style=\"font-size:8.5px;font-weight:800;letter-spacing:.08em;color:#0a1030;background:#ffdd33;border-radius:3px;padding:2px 5px;\" title=\"Syllabus-named: develops naturally through primary science\">SYLLABUS CORE<\u002Fspan>`:''}<\u002Fdiv>`:''}\n        <div style=\"font-size:12px;color:var(--text-dim);margin-top:4px;line-height:1.5;\">${teacher.desc||''}<\u002Fdiv>\n      <\u002Fdiv>\n      <button class=\"close-btn\" onclick=\"clearFocus()\">✕<\u002Fbutton>\n    <\u002Fdiv>\n\n    <!-- ── ACTIVITIES (PRIMARY) ── -->\n    <div class=\"info-section\" style=\"border:1px solid rgba(51,221,255,0.18);border-radius:10px;padding:12px;background:rgba(51,221,255,0.03);\">\n      <div class=\"info-section-label\" style=\"color:var(--cyan);letter-spacing:.08em;margin-bottom:8px;\">\n        🔬 Activities &amp; Experiments &nbsp;<span style=\"color:var(--text-faint);font-weight:400;\">(${teacher.projects.length})<\u002Fspan>\n        <span style=\"font-size:9px;color:var(--text-faint);font-weight:400;float:right;padding-top:2px;\">Click to highlight linked competencies<\u002Fspan>\n      <\u002Fdiv>`;\n\n  if(sharedProjects.length) html += `<div style=\"font-size:10px;color:var(--cyan);letter-spacing:.05em;margin-bottom:4px;font-weight:600;\">⭐ SHARED WITH CONNECTIONS<\u002Fdiv>`;\n  html += sharedProjects.map(p=>actPill(p,true)).join('');\n  if(uniqProjects.length&&sharedProjects.length) html += `<div style=\"font-size:10px;color:var(--text-faint);letter-spacing:.05em;margin-top:7px;margin-bottom:4px;\">OTHER ACTIVITIES<\u002Fdiv>`;\n  html += uniqProjects.map(p=>actPill(p,false)).join('');\n  if(!teacher.projects.length) html += '<div style=\"color:var(--text-faint);font-size:12px;\">None listed<\u002Fdiv>';\n\n  html += `<\u002Fdiv>\n\n    <!-- ── TAGS ── -->\n    <div class=\"info-section\">\n      <div class=\"info-section-label\">Tags &nbsp;<span style=\"color:var(--cyan);font-weight:700;font-size:12px;\">${pts} pt${pts!==1?'s':''}<\u002Fspan><\u002Fdiv>\n      <div class=\"pts-bar-wrap\"><div class=\"pts-bar\" style=\"width:${Math.round(pts/maxPts*100)}%;\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:4px;margin-top:7px;\">\n        ${teacher.tags.map(tg=>`<span style=\"background:rgba(80,180,120,0.12);border:1px solid rgba(80,180,120,0.35);border-radius:10px;padding:2px 9px;font-size:11px;color:var(--tag-text);\">#${tg}<\u002Fspan>`).join('')||'<span style=\"color:var(--text-faint);font-size:12px;\">No tags<\u002Fspan>'}\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ── CONNECTIONS ── -->\n    <div class=\"info-section\">\n      <div class=\"info-section-label\">Connected (${connections.length})<\u002Fdiv>\n      ${connections.length===0?'<div style=\"color:var(--text-faint);font-size:12px;\">No connections<\u002Fdiv>':connections.map(c=>{\n        const cc=getCol(c.subject);\n        const es=getEdgeStyle(teacher,c);\n        const lineColor=es?('#'+es.color.toString(16).padStart(6,'0')):'#8899cc';\n        const sharedActs=teacher.projects.filter(p=>c.projects.includes(p));\n        const sharedTags=teacher.tags.filter(tg=>c.tags.includes(tg));\n        return `<div class=\"connected-item\" style=\"flex-direction:column;align-items:flex-start;gap:5px;border-left:2px solid ${lineColor}55;padding-left:8px;margin-bottom:6px;\">\n          <div style=\"display:flex;align-items:center;gap:7px;width:100%;cursor:pointer;\" onclick=\"focusTeacher(${c.id})\">\n            <div style=\"width:8px;height:8px;border-radius:50%;background:${cc.css};box-shadow:0 0 5px ${cc.css};flex-shrink:0;\"><\u002Fdiv>\n            <div style=\"flex:1;\">\n              <span style=\"font-size:13px;color:${txtCol(c.subject)};font-weight:600;\">${c.name}<\u002Fspan>\n              <span style=\"font-size:11px;color:var(--text-dim);\"> · ${c.code||c.subject}<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"color:var(--text-faint);font-size:14px;\">›<\u002Fspan>\n          <\u002Fdiv>\n          ${sharedActs.length?`<div style=\"padding-left:15px;width:100%;\">\n            <div style=\"font-size:10px;color:var(--cyan);font-weight:600;margin-bottom:3px;\">📌 Shared — click to explore:<\u002Fdiv>\n            ${sharedActs.map(a=>`<div onclick=\"setActivityFilter('${a}');\" style=\"font-size:11px;color:var(--cyan);cursor:pointer;padding:2px 6px;border-radius:4px;display:inline-block;margin:1px 2px;background:rgba(51,221,255,0.06);border:1px solid rgba(51,221,255,0.18);\">• ${actLabel(a)}<\u002Fdiv>`).join('')}\n          <\u002Fdiv>`:''}\n          ${sharedTags.length?`<div style=\"padding-left:15px;display:flex;flex-wrap:wrap;gap:3px;margin-top:2px;\">\n            ${sharedTags.map(tg=>`<span style=\"background:rgba(80,180,120,0.1);border:1px solid rgba(80,180,120,0.3);border-radius:8px;padding:1px 7px;font-size:10px;color:var(--tag-text);\">#${tg}<\u002Fspan>`).join('')}\n          <\u002Fdiv>`:''}\n        <\u002Fdiv>`;\n      }).join('')}\n    <\u002Fdiv>\n\n    <!-- ── KEY ── -->\n    <div class=\"info-section\" style=\"border-top:1px solid var(--line);padding-top:14px;margin-top:4px;\">\n      <div class=\"info-section-label\" style=\"margin-bottom:8px;\">📖 Key — Competencies in View<\u002Fdiv>\n      ${keyNodes.map(n=>{\n        const nc=getCol(n.subject);\n        const isFocus=n.id===teacher.id;\n        return `<div style=\"display:flex;gap:7px;align-items:flex-start;margin-bottom:7px;cursor:pointer;\" onclick=\"focusTeacher(${n.id})\">\n          <div style=\"width:7px;height:7px;border-radius:50%;background:${nc.css};box-shadow:0 0 4px ${nc.css};flex-shrink:0;margin-top:4px;\"><\u002Fdiv>\n          <div>\n            <span style=\"font-size:12px;font-weight:700;color:${isFocus?txtCol(n.subject):'var(--text)'};\">${n.name}<\u002Fspan>\n            <span style=\"font-size:11px;color:var(--text-dim);\"> · ${n.subject}<\u002Fspan><br>\n            <span style=\"font-size:11px;color:var(--text-dim);line-height:1.4;\">${n.desc||''}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>`;\n      }).join('')}\n    <\u002Fdiv>\n\n    <div class=\"info-actions\">\n      <button class=\"info-btn-edit\" onclick=\"openEditModal(${teacher.id})\">✏ Edit<\u002Fbutton>\n      <button class=\"info-btn-del\" onclick=\"deleteTeacher(${teacher.id})\">🗑<\u002Fbutton>\n    <\u002Fdiv>`;\n\n  panel.innerHTML = html;\n  panel.classList.add('open');\n}\n\n// ================================================================\n// ACTIVITY FILTER\n// ================================================================\nlet activeActivity = null;\nfunction setActivityFilter(activity){\n  activeActivity = activity;\n  const bar = document.getElementById('activity-bar');\n  document.getElementById('activity-bar-name').textContent = actLabel(activity);\n  bar.classList.add('show');\n  applyActivityHighlight();\n}\nfunction clearActivityFilter(){\n  activeActivity = null;\n  document.getElementById('activity-bar').classList.remove('show');\n  if(focusedId) focusTeacher(focusedId);\n  else {\n    nodeMeshes.forEach(({mesh,teacher:t})=>{mesh.material.opacity=1;mesh.material.emissiveIntensity=0.42;});\n    edgeLines.forEach(l=>{const s=getEdgeStyle(teachers.find(t=>t.id===l.userData.t1),teachers.find(t=>t.id===l.userData.t2));l.material.opacity=s?s.opacity:0.2;});\n    labelEls.forEach(({el})=>{el.style.opacity='.85';});\n  }\n}\nwindow.clearActivityFilter=clearActivityFilter;\nfunction applyActivityHighlight(){\n  if(!activeActivity) return;\n  const matchIds=new Set(teachers.filter(t=>t.projects.includes(activeActivity)).map(t=>t.id));\n  nodeMeshes.forEach(({mesh,teacher:t})=>{\n    const match=matchIds.has(t.id);\n    mesh.material.opacity=match?1:.05;\n    mesh.material.emissiveIntensity=match?1.2:.02;\n  });\n  edgeLines.forEach(l=>{\n    const both=matchIds.has(l.userData.t1)&&matchIds.has(l.userData.t2);\n    l.material.opacity=both?.7:.01;\n  });\n  labelEls.forEach(({el,teacher:t})=>{el.style.opacity=matchIds.has(t.id)?'1':'.06';});\n}\nwindow.setActivityFilter=setActivityFilter;\n\n// ================================================================\n// SEARCH WITH DROPDOWN\n// ================================================================\nfunction getSearchResults(q){\n  if(!q||q.length<2) return [];\n  const results=[];\n  const seen=new Set();\n  teachers.forEach(t=>{\n    // node name match\n    if(t.name.toLowerCase().includes(q)||t.desc.toLowerCase().includes(q)||(t.code||'').toLowerCase().includes(q)){\n      if(!seen.has('node:'+t.id)){seen.add('node:'+t.id);results.push({type:'Competency',label:t.name,sub:t.code||t.subject,action:()=>focusTeacher(t.id)});}\n    }\n    // activity match (search real name, code and level)\n    t.projects.forEach(p=>{\n      const a=getAct(p); if(!a) return;\n      const hay=(a.name+' '+a.code+' '+a.level+' '+a.chapter).toLowerCase();\n      if(hay.includes(q)&&!seen.has('act:'+p)){\n        seen.add('act:'+p);\n        results.push({type:a.level,label:a.name,sub:`${a.code} · p${a.page}`,action:()=>setActivityFilter(p)});\n      }\n    });\n    // WOTD skill match\n    t.projects.forEach(p=>{\n      actWotd(p).forEach(w=>{\n        if((w.name+' '+w.full).toLowerCase().includes(q)&&!seen.has('w:'+w.name)){\n          seen.add('w:'+w.name);\n          results.push({type:'Skill',label:w.name,sub:`${w.activities.length} activities`,action:()=>setWotdFilter(w.name)});\n        }\n      });\n    });\n    // tag match\n    t.tags.forEach(tg=>{\n      if(tg.toLowerCase().includes(q)&&!seen.has('tag:'+tg)){\n        seen.add('tag:'+tg);\n        results.push({type:'Tag',label:'#'+tg,sub:`${teachers.filter(x=>x.tags.includes(tg)).length} competencies`,action:()=>{activeTagFilters.add(tg);simRunning=true;simFrame=0;buildScene();}});\n      }\n    });\n  });\n  return results.slice(0,12);\n}\n\nlet sdResults=[], sdOpen=false;\nfunction renderSearchDropdown(results){\n  const dd=document.getElementById('search-dropdown');\n  if(!results.length){dd.style.display='none';sdOpen=false;return;}\n  dd.style.display='block';sdOpen=true;\n  dd.innerHTML=results.map((r,i)=>`\n    <div class=\"sd-item\" onmousedown=\"selectSearchResult(${i})\">\n      <span class=\"sd-type\">${r.type}<\u002Fspan>\n      <span class=\"sd-label\">${r.label}<\u002Fspan>\n      <span class=\"sd-sub\">${r.sub}<\u002Fspan>\n    <\u002Fdiv>`).join('');\n  sdResults=results;\n}\nfunction selectSearchResult(i){\n  const r=sdResults[i]; if(!r) return;\n  document.getElementById('search-input').value='';\n  document.getElementById('search-dropdown').style.display='none';\n  sdOpen=false; searchQuery=''; buildScene(); updateCount();\n  r.action();\n}\nwindow.selectSearchResult=selectSearchResult;\n\n// ================================================================\n// SAVED VIEWS\n// ================================================================\nlet saves = loadJSON('scienceMapSaves', []);\nfunction saveCurrentView(){\n  const name=prompt('Name this view:','View '+(saves.length+1));\n  if(!name) return;\n  const save={id:Date.now(),name,focusedId,camera:{theta:orbit.theta,phi:orbit.phi,r:orbit.r,panX,panY},tagFilters:[...activeTagFilters],activity:activeActivity,date:new Date().toLocaleString()};\n  saves.unshift(save);\n  Store.set('scienceMapSaves',JSON.stringify(saves));\n  renderSaves();\n}\nfunction loadSave(id){\n  const s=saves.find(x=>x.id===id); if(!s) return;\n  orbit.theta=s.camera.theta; orbit.phi=s.camera.phi; orbit.r=s.camera.r;\n  panX=s.camera.panX||0; panY=s.camera.panY||0;\n  applyOrbit();\n  activeTagFilters=new Set(s.tagFilters||[]);\n  clearFocus(); buildScene();\n  if(s.focusedId) setTimeout(()=>focusTeacher(s.focusedId),80);\n  if(s.activity) setTimeout(()=>setActivityFilter(s.activity),120);\n}\nfunction deleteSave(id){\n  saves=saves.filter(s=>s.id!==id);\n  Store.set('scienceMapSaves',JSON.stringify(saves));\n  renderSaves();\n}\nfunction renderSaves(){\n  const el=document.getElementById('saves-list');\n  if(!el) return;\n  if(!saves.length){el.innerHTML='<div style=\"font-size:11px;color:var(--text-faint);\">No saved views yet.<\u002Fdiv>';return;}\n  el.innerHTML=saves.map(s=>`\n    <div class=\"save-item\" onclick=\"loadSave(${s.id})\">\n      <span class=\"save-name\">${s.name}<\u002Fspan>\n      <span class=\"save-date\">${s.date}<\u002Fspan>\n      <button class=\"save-del\" onclick=\"event.stopPropagation();deleteSave(${s.id})\" title=\"Delete\">×<\u002Fbutton>\n    <\u002Fdiv>`).join('');\n}\nwindow.saveCurrentView=saveCurrentView;\nwindow.loadSave=loadSave;\nwindow.deleteSave=deleteSave;\nrenderSaves();\n\n// ================================================================\n// NOTES\n// ================================================================\nlet notes = loadJSON('scienceMapNotes', []);\nlet notesOpen=false;\nfunction toggleNotes(){\n  notesOpen=!notesOpen;\n  document.getElementById('notes-panel').classList.toggle('open',notesOpen);\n  document.getElementById('notes-btn').textContent=notesOpen?'✕':'📝';\n}\nwindow.toggleNotes=toggleNotes;\nfunction saveNotes(){ Store.set('scienceMapNotes',JSON.stringify(notes)); }\nfunction addNote(){\n  const note={id:Date.now(),title:'',body:'',date:new Date().toLocaleDateString(),editing:true};\n  notes.unshift(note); saveNotes(); renderNotesList();\n}\nwindow.addNote=addNote;\nfunction deleteNote(id){\n  notes=notes.filter(n=>n.id!==id); saveNotes(); renderNotesList();\n}\nwindow.deleteNote=deleteNote;\nfunction saveNoteEdit(id){\n  const n=notes.find(x=>x.id===id); if(!n) return;\n  const tEl=document.getElementById('note-title-'+id);\n  const bEl=document.getElementById('note-body-'+id);\n  if(tEl) n.title=tEl.value;\n  if(bEl) n.body=bEl.value;\n  n.editing=false; n.date=new Date().toLocaleDateString();\n  saveNotes(); renderNotesList();\n}\nwindow.saveNoteEdit=saveNoteEdit;\nfunction editNote(id){\n  const n=notes.find(x=>x.id===id); if(!n) return;\n  n.editing=true; renderNotesList();\n  setTimeout(()=>{ const el=document.getElementById('note-title-'+id); if(el) el.focus(); },30);\n}\nwindow.editNote=editNote;\nfunction cancelNoteEdit(id){\n  const n=notes.find(x=>x.id===id); if(!n) return;\n  if(!n.title&&!n.body){ deleteNote(id); return; }\n  n.editing=false; renderNotesList();\n}\nwindow.cancelNoteEdit=cancelNoteEdit;\n\n// Render [[CCI 1]] links as clickable chips\nfunction renderNoteBody(body){\n  return body.replace(/\\[\\[([^\\]]+)\\]\\]/g,(match,ref)=>{\n    const t=COMPETENCIES.find(t=>t.name.toLowerCase()===ref.toLowerCase().trim());\n    const col=t?getCol(t.subject).css:'#70c090';\n    const idAttr=t?`onclick=\"toggleNotes();jumpToCompetency('${t.name}')\"`:'' ;\n    return `<span class=\"note-link\" style=\"color:${col};border-color:${col}55;\" ${idAttr}>🔗 ${ref}<\u002Fspan>`;\n  }).replace(/\\n/g,'<br>');\n}\nfunction renderNotesList(){\n  const el=document.getElementById('notes-list'); if(!el) return;\n  if(!notes.length){el.innerHTML='<div style=\"font-size:12px;color:var(--text-faint);\">No notes yet. Click ＋ to add one.<\u002Fdiv>';return;}\n  el.innerHTML=notes.map(n=>{\n    if(n.editing){\n      return `<div class=\"note-card\">\n        <input id=\"note-title-${n.id}\" class=\"note-title-input\" placeholder=\"Note title…\" value=\"${n.title.replace(/\"/g,'&quot;')}\">\n        <textarea id=\"note-body-${n.id}\" class=\"note-body-input\" placeholder=\"Write your thoughts… Use [[CCI 1]] to link to a competency.\">${n.body}<\u002Ftextarea>\n        <div class=\"note-actions-row\">\n          <button class=\"note-btn note-btn-save\" onclick=\"saveNoteEdit(${n.id})\">Save<\u002Fbutton>\n          <button class=\"note-btn note-btn-cancel\" onclick=\"cancelNoteEdit(${n.id})\">Cancel<\u002Fbutton>\n          <button class=\"note-btn note-btn-del\" onclick=\"deleteNote(${n.id})\">Delete<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>`;\n    }\n    return `<div class=\"note-card\">\n      <div style=\"font-size:13px;font-weight:700;color:var(--text);margin-bottom:5px;\">${n.title||'<span style=\"color:var(--text-faint);\">Untitled<\u002Fspan>'}<\u002Fdiv>\n      <div class=\"note-body-rendered\">${renderNoteBody(n.body)||'<span style=\"color:var(--text-faint);font-size:11px;\">Empty note.<\u002Fspan>'}<\u002Fdiv>\n      <div class=\"note-date\">${n.date}<\u002Fdiv>\n      <div class=\"note-actions-row\">\n        <button class=\"note-btn note-btn-save\" onclick=\"editNote(${n.id})\">Edit<\u002Fbutton>\n        <button class=\"note-btn note-btn-del\" onclick=\"deleteNote(${n.id})\">Delete<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join('');\n}\nrenderNotesList();\n\n// ================================================================\n// PDF SUPPORT  — one book per level, page numbers editable\n// ================================================================\n\n// user page overrides:  { 'P4-6.1': 118, ... }\nlet pageOverrides = loadJSON('scienceMapPageOverrides', {});\nfunction actPage(id){\n  if(pageOverrides[id]!==undefined) return pageOverrides[id];\n  const a=getAct(id); return a?a.page:1;\n}\n\nasync function loadScript(src){\n  return new Promise((res,rej)=>{\n    const el=document.createElement('script');el.src=src;el.onload=res;el.onerror=rej;document.head.appendChild(el);\n  });\n}\nasync function ensurePdfJs(){\n  if(!window.pdfjsLib){\n    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');\n    window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';\n  }\n}\n// ---- IndexedDB: keep uploaded books between sessions (files are far too big for localStorage) ----\nconst BOOKDB='scienceMapBooks';\nfunction idb(){\n  return new Promise((res,rej)=>{\n    const rq=indexedDB.open(BOOKDB,1);\n    rq.onupgradeneeded=()=>{ if(!rq.result.objectStoreNames.contains('pdfs')) rq.result.createObjectStore('pdfs'); };\n    rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error);\n  });\n}\nasync function bookSave(level, buf, filename){\n  try{\n    const db=await idb();\n    await new Promise((res,rej)=>{\n      const tx=db.transaction('pdfs','readwrite');\n      tx.objectStore('pdfs').put({buf,filename,saved:Date.now()},level);\n      tx.oncomplete=res; tx.onerror=()=>rej(tx.error);\n    });\n    return true;\n  }catch(e){ console.warn('could not cache book',e); return false; }\n}\nasync function bookLoad(level){\n  try{\n    const db=await idb();\n    return await new Promise((res,rej)=>{\n      const rq=db.transaction('pdfs','readonly').objectStore('pdfs').get(level);\n      rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>rej(rq.error);\n    });\n  }catch(e){ return null; }\n}\nasync function bookClear(level){\n  try{\n    const db=await idb();\n    await new Promise(res=>{\n      const tx=db.transaction('pdfs','readwrite');\n      tx.objectStore('pdfs').delete(level); tx.oncomplete=res;\n    });\n  }catch(e){}\n}\n\nfunction setBookStatus(level, html){ const el=document.getElementById('book-status-'+level); if(el) el.innerHTML=html; }\n\nasync function openBook(level, buf, filename, cache){\n  await ensurePdfJs();\n  // pdf.js transfers/detaches the buffer, so cache a copy first\n  if(cache) await bookSave(level, buf.slice(0), filename);\n  const doc=await window.pdfjsLib.getDocument({data:buf}).promise;\n  BOOKS[level].doc=doc; BOOKS[level].filename=filename;\n  const expect=BOOKS[level].pages;\n  setBookStatus(level, doc.numPages===expect\n    ? `<span style=\"color:#55cc88;\">✓ ${doc.numPages} pages · saved<\u002Fspan>`\n    : `<span style=\"color:#ffaa33;\">⚠ ${doc.numPages} pages (expected ${expect}) — check page links<\u002Fspan>`);\n  renderBooks();\n  if(focusedId) focusTeacher(focusedId);\n}\n\nasync function handleBookUpload(input, level){\n  const file=input.files[0]; if(!file) return;\n  setBookStatus(level,'<span style=\"color:var(--text-dim);\">reading…<\u002Fspan>');\n  try{\n    await openBook(level, await file.arrayBuffer(), file.name, true);\n  }catch(e){\n    setBookStatus(level,'<span style=\"color:#ff5555;\">✕ could not read this PDF<\u002Fspan>');\n    console.error(e);\n  }\n}\nwindow.handleBookUpload=handleBookUpload;\n\nwindow.removeBook=async function(level){\n  if(!confirm(`Remove the ${level} Activity Book from this browser?`)) return;\n  BOOKS[level].doc=null; BOOKS[level].filename='';\n  await bookClear(level); renderBooks();\n  if(focusedId) focusTeacher(focusedId);\n};\n\n// restore any previously-uploaded books on start\nasync function restoreBooks(){\n  for(const lv of ['P3','P4','P5','P6']){\n    const rec=await bookLoad(lv);\n    if(rec && rec.buf){\n      setBookStatus(lv,'<span style=\"color:var(--text-dim);\">restoring…<\u002Fspan>');\n      try{ await openBook(lv, rec.buf.slice(0), rec.filename, false); }\n      catch(e){ setBookStatus(lv,'<span style=\"color:#ff5555;\">✕ cached copy unreadable<\u002Fspan>'); }\n    }\n  }\n}\n\n// ---- edit a page number ----\nfunction editActivityPage(id){\n  const a=getAct(id); if(!a) return;\n  const cur=actPage(id);\n  const max=BOOKS[a.level].doc ? BOOKS[a.level].doc.numPages : BOOKS[a.level].pages;\n  const v=prompt(\n    `${a.level} ${a.code} — ${a.name}\\n\\n`+\n    `Printed page in book: ${a.printed}\\n`+\n    `PDF page currently used: ${cur}   (1–${max})\\n\\n`+\n    `Enter the correct PDF page number:`, cur);\n  if(v===null) return;\n  const n=parseInt(v,10);\n  if(isNaN(n)||n<1||n>max){ alert(`Please enter a number between 1 and ${max}.`); return; }\n  if(n===a.page) delete pageOverrides[id]; else pageOverrides[id]=n;\n  Store.set('scienceMapPageOverrides',JSON.stringify(pageOverrides));\n  if(focusedId) focusTeacher(focusedId);\n  if(pdfModalActivity===id) renderPdfModalPage(n);\n}\nwindow.editActivityPage=editActivityPage;\n\nfunction resetAllPages(){\n  if(!confirm('Reset every edited page number back to the original mapping?')) return;\n  pageOverrides={}; Store.set('scienceMapPageOverrides','{}');\n  if(focusedId) focusTeacher(focusedId);\n  alert('All page numbers reset.');\n}\nwindow.resetAllPages=resetAllPages;\n\n// ---- PDF viewer modal ----\nlet pdfModalPage=1, pdfModalActivity='', pdfModalLevel='';\nasync function openPdfModal(id, targetPage){\n  const a=getAct(id); if(!a) return;\n  const bk=BOOKS[a.level];\n  if(!bk.doc){\n    alert(`The ${a.level} Activity Book has not been uploaded yet.\\n\\nUpload it under \"Activity Books\" in the sidebar, then click 📄 again.`);\n    return;\n  }\n  pdfModalActivity=id; pdfModalLevel=a.level; pdfModalPage=targetPage||actPage(id);\n  document.getElementById('pdf-modal-title').innerHTML=\n    `<span style=\"color:${lvlCol(a.level)};\">${a.level} · Activity ${a.code}<\u002Fspan><br>${a.name}\n     <div style=\"font-size:11px;color:var(--text-faint);font-weight:400;margin-top:3px;\">${a.chapter}<\u002Fdiv>`;\n  renderModalCompetencies(id);\n  document.getElementById('pdf-modal').style.display='flex';\n  await renderPdfModalPage(pdfModalPage);\n}\nwindow.openPdfModal=openPdfModal;\nwindow.closePdfModal=function(){document.getElementById('pdf-modal').style.display='none';pdfModalActivity='';};\n\n// ---- competencies developed by this activity (right column of modal) ----\nconst STRANDS = [\n  { key:'CCI',  label:'Communication, Collaboration & Information Skills' },\n  { key:'CAIT', label:'Critical, Adaptive & Inventive Thinking' },\n  { key:'CGC',  label:'Civic, Global & Cross-Cultural Literacy' },\n];\nfunction renderModalCompetencies(actId){\n  const el=document.getElementById('pdf-modal-right'); if(!el) return;\n  const a=getAct(actId);\n  const linked=teachers.filter(t=>t.projects.includes(actId));\n\n  // tags shared across the linked competencies\n  const tagCount={};\n  linked.forEach(t=>t.tags.forEach(tg=>tagCount[tg]=(tagCount[tg]||0)+1));\n  const common=Object.entries(tagCount).filter(([,n])=>n>1).sort((x,y)=>y[1]-x[1]).map(([tg])=>tg);\n\n  // ---- Check-for-Understanding: question-level breakdown ----\n  let html='';\n  if(cfuQuestions(actId)){\n    html += `<div style=\"font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:var(--cyan);margin-bottom:8px;\">\n        Process skills by question\n      <\u002Fdiv>` + renderCfuQuestions(actId, true) +\n      `<div style=\"height:1px;background:var(--line);margin:15px 0 13px;\"><\u002Fdiv>`;\n  }\n\n  // ---- Ways of Thinking & Doing for this activity ----\n  const ws=cfuQuestions(actId)?[]:actWotd(actId);\n  if(ws.length){\n    html += `<div style=\"font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:var(--text-dim);margin-bottom:8px;\">\n        Ways of Thinking &amp; Doing <span style=\"font-weight:400;text-transform:none;letter-spacing:0;\">· science process skills<\u002Fspan>\n      <\u002Fdiv>`;\n    ws.forEach(w=>{\n      const note=wotdNote(actId,w.name);\n      const outcome = (a && (a.level==='P3'||a.level==='P4')) ? w.byP4 : (w.byP6||w.byP4);\n      html += `<div onclick=\"closePdfModal();setWotdFilter('${w.name}')\" title=\"Filter the map by this skill\"\n        style=\"border-left:3px solid ${w.color};background:${w.color}0f;border-radius:0 8px 8px 0;padding:8px 11px;margin-bottom:6px;cursor:pointer;\">\n        <div style=\"font-size:12.5px;font-weight:700;color:${wotdCol(w)};\">${w.name}<\u002Fdiv>\n        <div style=\"font-size:11px;color:var(--text-dim);margin-top:2px;line-height:1.5;\">${w.full}<\u002Fdiv>\n        ${note?`<div style=\"font-size:11px;color:var(--text-mid);margin-top:5px;padding-top:5px;border-top:1px solid var(--line);\">\n           <span style=\"color:${wotdCol(w)};font-weight:600;\">In this activity:<\u002Fspan> ${note}<\u002Fdiv>`:''}\n        ${outcome?`<div style=\"font-size:10px;color:var(--text-faint);margin-top:4px;line-height:1.5;\">\n           <em>By end of ${(a&&(a.level==='P3'||a.level==='P4'))?'P4':'P6'}:<\u002Fem> ${outcome}<\u002Fdiv>`:''}\n      <\u002Fdiv>`;\n    });\n    html += `<div style=\"height:1px;background:var(--line);margin:15px 0 13px;\"><\u002Fdiv>`;\n  }\n\n  html += `<div style=\"display:flex;align-items:baseline;gap:8px;margin-bottom:3px;\">\n      <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:var(--cyan);\">21st Century Competencies developed<\u002Fdiv>\n    <\u002Fdiv>`;\n  if(!linked.length){\n    html += `<div style=\"font-size:12px;color:var(--text-faint);margin-top:6px;\">No competencies mapped to this activity yet — use ✏ Edit on a competency to add it.<\u002Fdiv>`;\n    el.innerHTML=html; return;\n  }\n  html += `<div style=\"font-size:11px;color:var(--text-faint);margin-bottom:12px;\">\n      ${linked.length} competenc${linked.length>1?'ies':'y'} · ${a?a.level+' '+a.code:''} · click any card to open it on the map\n    <\u002Fdiv>`;\n\n  STRANDS.forEach(st=>{\n    const grp=linked.filter(t=>t.name.startsWith(st.key));\n    if(!grp.length) return;\n    html+=`<div class=\"cc-strand\">${st.key} — ${st.label}<\u002Fdiv>`;\n    grp.forEach(t=>{\n      const c=getCol(t.subject);\n      const tier=TIERS[getRank(t.role)];\n      const others=t.projects.length-1;\n      html+=`<div class=\"cc-card\" style=\"border-left-color:${c.css};\" onclick=\"closePdfModal();focusTeacher(${t.id});\">\n        <div class=\"cc-card-top\">\n          <span style=\"width:9px;height:9px;border-radius:50%;background:${c.css};box-shadow:0 0 6px ${c.css};flex-shrink:0;\"><\u002Fspan>\n          <span class=\"cc-card-name\" style=\"color:${txtCol(t.subject)};\">${t.name}<\u002Fspan>\n          <span class=\"cc-card-domain\" style=\"background:${c.css}1f;border:1px solid ${c.css}66;color:${txtCol(t.subject)};\">${t.subject}<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"cc-card-desc\">${t.desc||''}<\u002Fdiv>\n        <div class=\"cc-card-meta\">\n          <span style=\"color:${tierCol(tier)};\">◆ Tier ${getRank(t.role)+1} · ${tier.label}<\u002Fspan>\n          <span style=\"color:var(--text-faint);\">·<\u002Fspan>\n          <span>${others} other activit${others===1?'y':'ies'}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>`;\n    });\n  });\n\n  if(common.length){\n    html+=`<div class=\"cc-strand\">Shared focus across these competencies<\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:5px;\">\n        ${common.map(tg=>`<span class=\"mini-tag\">#${tg}<\u002Fspan>`).join('')}\n      <\u002Fdiv>`;\n  }\n  el.innerHTML=html;\n}\nwindow.renderModalCompetencies=renderModalCompetencies;\n\nasync function renderPdfModalPage(pageNum){\n  const bk=BOOKS[pdfModalLevel]; if(!bk||!bk.doc) return;\n  pageNum=Math.max(1,Math.min(bk.doc.numPages,pageNum));\n  pdfModalPage=pageNum;\n  const page=await bk.doc.getPage(pageNum);\n  const canvas=document.getElementById('pdf-modal-canvas');\n  const maxW=Math.min(620,window.innerWidth*0.8);\n  const vp=page.getViewport({scale:maxW/page.getViewport({scale:1}).width});\n  canvas.width=vp.width; canvas.height=vp.height;\n  await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;\n  const a=getAct(pdfModalActivity);\n  const isSaved = a && pageNum===actPage(pdfModalActivity);\n  document.getElementById('pdf-modal-page').innerHTML=\n    `Page ${pageNum} / ${bk.doc.numPages}` +\n    (isSaved?'':` <span style=\"color:#ffaa33;\">· not the linked page<\u002Fspan>`);\n  const btn=document.getElementById('pdf-modal-setpage');\n  if(btn) btn.style.display = isSaved ? 'none' : 'inline-block';\n}\nwindow.pdfModalPrev=async function(){await renderPdfModalPage(pdfModalPage-1);};\nwindow.pdfModalNext=async function(){await renderPdfModalPage(pdfModalPage+1);};\nwindow.pdfModalSetPage=function(){\n  if(!pdfModalActivity) return;\n  const a=getAct(pdfModalActivity); if(!a) return;\n  if(pdfModalPage===a.page) delete pageOverrides[pdfModalActivity];\n  else pageOverrides[pdfModalActivity]=pdfModalPage;\n  Store.set('scienceMapPageOverrides',JSON.stringify(pageOverrides));\n  renderPdfModalPage(pdfModalPage);\n  if(focusedId) focusTeacher(focusedId);\n};\n\n// ---- sidebar book list ----\nfunction renderBooks(){\n  const el=document.getElementById('books-list'); if(!el) return;\n  el.innerHTML=['P3','P4','P5','P6'].map(lv=>{\n    const bk=BOOKS[lv];\n    const n=ACTIVITIES.filter(a=>a.level===lv).length;\n    const done=bk.doc?`<span style=\"color:#55cc88;\">✓ ${bk.doc.numPages} pages<\u002Fspan>`:`<span style=\"color:var(--text-faint);\">not uploaded<\u002Fspan>`;\n    return `<div style=\"display:flex;align-items:center;gap:7px;padding:5px 7px;margin-bottom:4px;background:var(--card);border:1px solid ${LEVEL_COL[lv]}33;border-radius:6px;\">\n      <span style=\"font-size:10px;font-weight:800;color:${lvlCol(lv)};background:${LEVEL_COL[lv]}1c;border-radius:4px;padding:2px 6px;\">${lv}<\u002Fspan>\n      <div style=\"flex:1;min-width:0;\">\n        <div style=\"font-size:11px;color:var(--text-mid);\">${n} activities<\u002Fdiv>\n        <div id=\"book-status-${lv}\" style=\"font-size:10px;\">${done}<\u002Fdiv>\n      <\u002Fdiv>\n      ${bk.doc?`<button onclick=\"removeBook('${lv}')\" title=\"Remove ${lv} book\" style=\"background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:13px;padding:0 3px;line-height:1;\">×<\u002Fbutton>`:''}\n      <label style=\"cursor:pointer;font-size:14px;opacity:.75;\" title=\"${bk.doc?'Replace':'Upload'} ${lv} Activity Book\">📂\n        <input type=\"file\" accept=\".pdf\" style=\"display:none;\" onchange=\"handleBookUpload(this,'${lv}')\">\n      <\u002Flabel>\n    <\u002Fdiv>`;\n  }).join('');\n}\nwindow.renderBooks=renderBooks;\nrenderBooks();\n\n// If the PDFs are sitting in a books/ folder next to this file (e.g. on a web\n// server or GitHub Pages), pick them up automatically. Silently skipped when\n// opened straight from disk, where browsers block these reads.\nasync function autoloadBooks(){\n  const names={P3:'books/P3.pdf',P4:'books/P4.pdf',P5:'books/P5.pdf',P6:'books/P6.pdf'};\n  for(const [lv,url] of Object.entries(names)){\n    if(BOOKS[lv].doc) continue;\n    try{\n      const r=await fetch(url); if(!r.ok) continue;\n      const buf=await r.arrayBuffer();\n      if(buf.byteLength<1000) continue;\n      setBookStatus(lv,'<span style=\"color:var(--text-dim);\">loading…<\u002Fspan>');\n      await openBook(lv, buf, url.split('/').pop(), false);\n    }catch(e){ /* not served / not present */ }\n  }\n}\n\n// startup: cached copies first, then any files served alongside the app\n(async()=>{ await restoreBooks(); await autoloadBooks(); })();\n\n// ================================================================\n// SIDEBAR\n// ================================================================\nfunction updateLegend(){\n  const domains=[...new Set(teachers.map(t=>t.subject))];\n  document.getElementById('legend').innerHTML=domains.map(s=>{\n    const c=getCol(s),cnt=teachers.filter(t=>t.subject===s).length;\n    return `<div class=\"legend-item\"><div class=\"legend-dot\" style=\"background:${c.css};box-shadow:0 0 5px ${c.css};\"><\u002Fdiv><div class=\"legend-label\">${s}<\u002Fdiv><div class=\"legend-count\">${cnt}<\u002Fdiv><\u002Fdiv>`;\n  }).join('');\n}\nfunction updateTagFilters(){\n  const tags=[...new Set(teachers.flatMap(t=>t.tags))].sort();\n  document.getElementById('tag-filters').innerHTML=tags.length\n    ?tags.map(tg=>`<span class=\"tag-chip ${activeTagFilters.has(tg)?'active':''}\" onclick=\"toggleTag('${tg}')\">#${tg}<\u002Fspan>`).join('')\n    :'<div style=\"color:var(--text-faint);font-size:11px;\">No tags yet<\u002Fdiv>';\n}\nfunction updateCount(){\n  const v=getVisible().length;\n  const noun = viewMode==='activity' ? `activit${v!==1?'ies':'y'}`\n             : viewMode==='wotd'     ? `process skill${v!==1?'s':''}`\n             : `competenc${v!==1?'ies':'y'}`;\n  document.getElementById('node-count').textContent=`${v} ${noun}`;\n}\nfunction updateTagPointsUI(){\n  const tags=[...new Set(teachers.flatMap(t=>t.tags))].sort();\n  if(!tags.length){document.getElementById('tp-list').innerHTML='<div style=\"color:var(--text-faint);font-size:11px;\">Add tags first.<\u002Fdiv>';return;}\n  document.getElementById('tp-list').innerHTML=tags.map(tg=>{\n    const pts=getTagPts(tg);\n    return `<div class=\"tp-row\">\n      <span class=\"tp-label\">#${tg}<\u002Fspan>\n      <div class=\"tp-controls\">\n        <button class=\"tp-btn\" onclick=\"adjPts('${tg}',-1)\">−<\u002Fbutton>\n        <input class=\"tp-val\" type=\"number\" min=\"0\" max=\"99\" value=\"${pts}\" id=\"tp-${CSS.escape(tg)}\" onchange=\"setPts('${tg}',this.value)\">\n        <button class=\"tp-btn\" onclick=\"adjPts('${tg}',1)\">+<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join('');\n}\n\nlet tpOpen=false;\nwindow.toggleTagPoints=function(){\n  tpOpen=!tpOpen;\n  document.getElementById('tag-points-panel').style.display=tpOpen?'block':'none';\n  document.getElementById('tp-toggle').textContent=tpOpen?'▼':'▶';\n};\nwindow.adjPts=function(tag,d){\n  tagPoints[tag]=Math.max(0,(tagPoints[tag]??1)+d);\n  const inp=document.getElementById('tp-'+CSS.escape(tag));\n  if(inp) inp.value=tagPoints[tag];\n  rebuildSizes();\n};\nwindow.setPts=function(tag,v){\n  tagPoints[tag]=Math.max(0,parseInt(v)||0);\n  rebuildSizes();\n};\nfunction rebuildSizes(){\n  const prev=focusedId;\n  simRunning=true; simFrame=0;\n  buildScene();\n  if(prev) focusTeacher(prev);\n}\nwindow.toggleTag=function(tag){\n  activeTagFilters.has(tag)?activeTagFilters.delete(tag):activeTagFilters.add(tag);\n  simRunning=true;simFrame=0;clearFocus();buildScene();\n};\n\ndocument.getElementById('group-by').addEventListener('change',e=>{\n  groupBy=e.target.value;\n  if(groupBy==='hierarchy'){\n    orbit.theta=0; orbit.phi=Math.PI/2; applyOrbit();\n    autoRotate=false;\n    document.getElementById('hier-sidebar').style.display='block';\n  } else {\n    autoRotate=true;\n    document.getElementById('hier-sidebar').style.display='none';\n  }\n  simRunning=true; simFrame=0;\n  teachers.forEach(t=>{t.vx=(Math.random()-.5)*3;t.vy=(Math.random()-.5)*3;t.vz=(Math.random()-.5)*3;});\n});\ndocument.getElementById('search-input').addEventListener('input',e=>{\n  const raw=e.target.value;\n  const q=raw.toLowerCase().trim();\n  // If query is 2+ chars, show dropdown results\n  if(q.length>=2){\n    const results=getSearchResults(q);\n    renderSearchDropdown(results);\n    // Also filter the map nodes normally\n    searchQuery=q;\n  } else {\n    document.getElementById('search-dropdown').style.display='none';\n    searchQuery=q;\n  }\n  clearFocus(); buildScene(); updateCount();\n});\ndocument.getElementById('search-input').addEventListener('blur',()=>{\n  setTimeout(()=>{document.getElementById('search-dropdown').style.display='none';},150);\n});\ndocument.getElementById('search-input').addEventListener('keydown',e=>{\n  if(e.key==='Escape'){document.getElementById('search-dropdown').style.display='none';e.target.blur();}\n});\n\n// ================================================================\n// MODAL\n// ================================================================\nlet modalTags=[], modalProjects=[];\nfunction openAddModal(){\n  modalTags=[];modalProjects=[];\n  document.getElementById('edit-id').value='';\n  document.getElementById('modal-title').textContent='Add Competency';\n  document.getElementById('f-name').value='';\n  document.getElementById('f-subject').value='Communication';\n  document.getElementById('f-role').value='';\n  renderTagsInput();renderProjectsInput();\n  document.getElementById('modal-overlay').classList.add('open');\n  setTimeout(()=>document.getElementById('f-name').focus(),50);\n}\nwindow.openEditModal=function(id){\n  const t=teachers.find(t=>t.id===id);if(!t) return;\n  modalTags=[...t.tags];modalProjects=[...t.projects];\n  document.getElementById('edit-id').value=id;\n  document.getElementById('modal-title').textContent='Edit Competency';\n  document.getElementById('f-name').value=t.name;\n  document.getElementById('f-subject').value=t.subject;\n  document.getElementById('f-role').value=t.role;\n  renderTagsInput();renderProjectsInput();\n  document.getElementById('modal-overlay').classList.add('open');\n};\nwindow.closeModal=function(){document.getElementById('modal-overlay').classList.remove('open');};\n\nfunction renderTagsInput(){\n  const c=document.getElementById('tags-container'),inp=document.getElementById('new-tag-input');\n  c.innerHTML='';\n  modalTags.forEach((tag,i)=>{\n    const chip=document.createElement('div');chip.className='tag-input-chip';\n    chip.innerHTML=`#${tag} <span class=\"tag-remove\" onclick=\"rmTag(${i})\">×<\u002Fspan>`;\n    c.appendChild(chip);\n  });\n  c.appendChild(inp);\n}\nwindow.rmTag=function(i){modalTags.splice(i,1);renderTagsInput();};\ndocument.getElementById('new-tag-input').addEventListener('keydown',e=>{\n  if(e.key==='Enter'||e.key===','){\n    e.preventDefault();\n    const v=e.target.value.trim().replace(/^#/,'');\n    if(v&&!modalTags.includes(v))modalTags.push(v);\n    e.target.value='';renderTagsInput();\n    setTimeout(()=>document.getElementById('new-tag-input').focus(),0);\n  }\n  if(e.key==='Backspace'&&e.target.value===''&&modalTags.length){\n    modalTags.pop();renderTagsInput();\n    setTimeout(()=>document.getElementById('new-tag-input').focus(),0);\n  }\n});\n\nfunction renderProjectsInput(){\n  document.getElementById('projects-list').innerHTML=modalProjects.map((p,i)=>`\n    <div class=\"project-row\">\n      <input type=\"text\" class=\"form-input\" value=\"${p}\" oninput=\"modalProjects[${i}]=this.value\" placeholder=\"e.g. P3 Plant Study…\">\n      <button class=\"remove-project\" onclick=\"rmProj(${i})\">×<\u002Fbutton>\n    <\u002Fdiv>`).join('');\n}\nwindow.addProjectField=function(){modalProjects.push('');renderProjectsInput();};\nwindow.rmProj=function(i){modalProjects.splice(i,1);renderProjectsInput();};\n\nwindow.saveTeacher=function(){\n  const name=document.getElementById('f-name').value.trim();\n  if(!name){document.getElementById('f-name').style.borderColor='#ff4455';return;}\n  document.getElementById('f-name').style.borderColor='';\n  const subject=document.getElementById('f-subject').value;\n  const role=document.getElementById('f-role').value.trim()||'Subject Dependent';\n  const projects=modalProjects.filter(p=>p.trim());\n  const tags=[...modalTags];\n  const editId=document.getElementById('edit-id').value;\n  if(editId){\n    const t=teachers.find(t=>t.id==editId);\n    if(t){t.name=name;t.subject=subject;t.role=role;t.projects=projects;t.tags=tags;}\n  } else {\n    const a=Math.random()*Math.PI*2;\n    teachers.push({id:nextId++,name,subject,role,projects,tags,\n      x:Math.cos(a)*60,y:getTierY(getRank(role))+(Math.random()-.5)*20,z:Math.sin(a)*60,vx:0,vy:0,vz:0});\n  }\n  simRunning=true;simFrame=0;clearFocus();buildScene();\n  closeModal();\n};\nwindow.deleteTeacher=function(id){\n  if(viewMode!=='competency'){ alert('Switch to the 21st CC Competencies view to edit competencies.'); return; }\n  if(!confirm('Remove this competency from the map?')) return;\n  teachers=teachers.filter(t=>t.id!==id);clearFocus();buildScene();\n};\n\ndocument.getElementById('add-btn').addEventListener('click',openAddModal);\ndocument.getElementById('modal-overlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});\n\n// ================================================================\n// HALOS FACE CAMERA\n// ================================================================\nfunction updateHalos(){\n  nodeMeshes.forEach(({mesh})=>mesh.children.forEach(c=>{if(c.isMesh)c.lookAt(camera.position);}));\n}\n\n// MOE syllabus themes (Diversity, Cycles, Systems, Energy, Interactions)\nconst CHAPTER_THEME = {\n  'Diversity of Living and Non-living Things':'Diversity',\n  'Classification of Living Things':'Diversity',\n  'Diversity of Materials':'Diversity',\n  'Life Cycles of Plants':'Cycles',\n  'Life Cycles of Animals':'Cycles',\n  'Reproduction in Animals and Plants':'Cycles',\n  'Cycles in Water':'Cycles',\n  'Matter':'Cycles',\n  'Plant System':'Systems',\n  'Human Systems':'Systems',\n  'Plant Transport System':'Systems',\n  'Respiratory and Circulatory Systems':'Systems',\n  'Electrical Systems':'Systems',\n  'Series and Parallel Circuits':'Systems',\n  'Light':'Energy',\n  'Shadows':'Energy',\n  'Heat':'Energy',\n  'Effects of Heat':'Energy',\n  'Photosynthesis':'Energy',\n  'Energy Conversion':'Energy',\n  'Properties of Magnets':'Interactions',\n  'Making and Using Magnets':'Interactions',\n  'Interaction of Forces':'Interactions',\n  'Interactions Within the Environment':'Interactions',\n  'Surviving in the Environment':'Interactions',\n  'Thematic':'Interactions',\n};\nconst THEME_ORDER = ['Diversity','Cycles','Systems','Energy','Interactions'];\nconst THEME_COL = { Diversity:'#33cc77', Cycles:'#33ddff', Systems:'#aa55ff', Energy:'#ffaa33', Interactions:'#ff4455' };\nconst THEME_COL_DAY = { Diversity:'#1c7d47', Cycles:'#00758d', Systems:'#9429ff', Energy:'#9f5d00', Interactions:'#dc0014' };\nfunction themeOf(actId){ const a=getAct(actId); return a ? (CHAPTER_THEME[a.chapter]||'Interactions') : 'Interactions'; }\nfunction themeCol(t){ return (typeof isDayMode!=='undefined' && isDayMode) ? (THEME_COL_DAY[t]||'#555') : (THEME_COL[t]||'#889'); }\n// one-time migration: Board became the default view, so a stored 'map' from\n// before the change must not pin returning browsers to the cluttered view.\n(function(){\n  if(Store.get('scienceMapDefaults','') !== 'board-v1'){\n    Store.set('scienceMapLayout','board');\n    Store.set('scienceMapBoardGroup','level');\n    Store.set('scienceMapDefaults','board-v1');\n  }\n})();\nlet boardGroupBy = Store.get('scienceMapBoardGroup','level');\nfunction setBoardGroup(g){ boardGroupBy = g; Store.set('scienceMapBoardGroup', g);\n  document.getElementById('bg-level').classList.toggle('on', g==='level');\n  document.getElementById('bg-theme').classList.toggle('on', g==='theme');\n  renderBoard(); }\nwindow.setBoardGroup = setBoardGroup;\n\n// ================================================================\n// BOARD (flat 2D view)\n// ================================================================\nlet layout = Store.get('scienceMapLayout','board');\n\nfunction setLayout(l){\n  layout = (l==='board') ? 'board' : 'map';\n  Store.set('scienceMapLayout', layout);\n  const isBoard = layout==='board';\n  document.getElementById('board').classList.toggle('on', isBoard);\n  document.getElementById('lt-map').classList.toggle('on', !isBoard);\n  document.getElementById('lt-board').classList.toggle('on', isBoard);\n  document.getElementById('canvas').style.display = isBoard?'none':'block';\n  document.getElementById('hint').style.display   = isBoard?'none':'block';\n  document.getElementById('hier-labels').style.visibility = isBoard?'hidden':'visible';\n  labelEls.forEach(({el})=>{ el.style.visibility = isBoard?'hidden':'visible'; });\n  if(isBoard) renderBoard();\n}\nwindow.setLayout = setLayout;\n\n// activity chips carry a dot per process skill they build\nfunction skillDots(actId){\n  const ws = actWotd(actId).slice(0,4);\n  if(!ws.length) return '';\n  return `<span class=\"bchip-skills\">${ws.map(w=>\n    `<span class=\"bskill-dot\" title=\"${w.name}\" style=\"background:${wotdCol(w)};box-shadow:0 0 4px ${wotdCol(w)};\"><\u002Fspan>`).join('')}<\u002Fspan>`;\n}\n\nfunction boardGroups(){\n  const visible = getVisible();\n  if(viewMode==='competency'){\n    return TIERS.map((tier,i)=>({\n      label: tier.label, color: tierCol(tier),\n      sections: [{ items: visible.filter(t=>getRank(t.role)===i).map(t=>({\n        name: t.name, meta: `${t.projects.length} act`, code: t.code||'',\n        extra: t.core?'<span class=\"bcore\" title=\"Named in the syllabus as developing naturally through primary science\">SYL<\u002Fspan>':'',\n        color: txtCol(t.subject), onclick: `focusTeacher(${t.id})`, id: t.id }))}]\n    })).filter(g=>g.sections[0].items.length);\n  }\n  if(viewMode==='activity'){\n    const chip = (t,col) => { const a=getAct(t.actId);\n      return { name: t.name, meta: 'p.'+actPage(t.actId), code:'', badge: a?a.code:'',\n               extra: skillDots(t.actId), color: col,\n               onclick: `focusTeacher(${t.id})`, id: t.id }; };\n    if(boardGroupBy==='theme'){\n      // one column per syllabus theme, split by level so progression reads down the card\n      return THEME_ORDER.map(th=>{\n        const nodes = visible.filter(t=>themeOf(t.actId)===th);\n        const levels = ['P3','P4','P5','P6'].filter(lv=>nodes.some(t=>t.subject===lv));\n        return {\n          label: th, color: themeCol(th), count: nodes.length,\n          sections: levels.map(lv=>({\n            title: 'Primary '+lv[1],\n            items: nodes.filter(t=>t.subject===lv).map(t=>chip(t, lvlCol(lv)))\n          }))\n        };\n      }).filter(g=>g.count);\n    }\n    return ['P3','P4','P5','P6'].map(lv=>{\n      const nodes = visible.filter(t=>t.subject===lv);\n      const chapters = [...new Set(nodes.map(t=>{const a=getAct(t.actId);return a?a.chapter:'Other';}))];\n      return {\n        label: 'Primary '+lv[1], color: lvlCol(lv), count: nodes.length,\n        sections: chapters.map(ch=>({\n          title: ch,\n          items: nodes.filter(t=>{const a=getAct(t.actId);return (a?a.chapter:'Other')===ch;}).map(t=>chip(t, lvlCol(lv)))\n        }))\n      };\n    }).filter(g=>g.count);\n  }\n  // ways of thinking & doing — one card per skill, its activities inside\n  return visible.map(t=>{\n    const w = wotdByName(t.wotdName);\n    const byLevel = {};\n    t.projects.forEach(aid=>{ const a=getAct(aid); if(!a) return; (byLevel[a.level]=byLevel[a.level]||[]).push(a); });\n    return {\n      label: t.name, color: w?wotdCol(w):'#7799bb', count: t.projects.length,\n      head: `focusTeacher(${t.id})`,\n      sections: Object.keys(byLevel).sort().map(lv=>({\n        title: 'Primary '+lv[1],\n        items: byLevel[lv].map(a=>({ name: a.name, meta: 'p.'+actPage(a.id), code:'', badge: a.code,\n          color: lvlCol(lv), onclick: `openPdfModal('${a.id}')`, id: a.id }))\n      }))\n    };\n  }).filter(g=>g.count);\n}\n\nfunction renderBoard(){\n  const grid = document.getElementById('board-grid');\n  const title = document.getElementById('board-title');\n  const groups = boardGroups();\n  const total = groups.reduce((s,g)=>s+g.sections.reduce((n,sec)=>n+sec.items.length,0),0);\n  const groupedBy = viewMode==='competency' ? 'competency group'\n                  : viewMode==='activity' ? (boardGroupBy==='theme' ? 'syllabus theme, then primary level' : 'primary level, then chapter')\n                  : 'process skill, then primary level';\n  document.getElementById('board-group').style.display = viewMode==='activity' ? 'flex' : 'none';\n  document.getElementById('bg-level').classList.toggle('on', boardGroupBy!=='theme');\n  document.getElementById('bg-theme').classList.toggle('on', boardGroupBy==='theme');\n  title.textContent = `${total} ${viewMode==='activity'?'activities':viewMode==='wotd'?'activities across 8 skills':'competencies'} · grouped by ${groupedBy} · click any row to open its details`;\n\n  if(!groups.length){\n    grid.innerHTML = `<div id=\"board-empty\">Nothing matches the current filters.<\u002Fdiv>`;\n    return;\n  }\n  grid.innerHTML = groups.map(g=>{\n    const n = g.count ?? g.sections.reduce((s,sec)=>s+sec.items.length,0);\n    return `<div class=\"bgroup\">\n      <div class=\"bgroup-rail\" style=\"color:${g.color};\"><\u002Fdiv>\n      <div class=\"bgroup-head\" style=\"color:${g.color};${g.head?'cursor:pointer;':''}\" ${g.head?`onclick=\"${g.head}\"`:''}>\n        <span class=\"bgroup-name\" style=\"color:${g.color};\">${g.label}<\u002Fspan>\n        <span class=\"bgroup-count\">${n}<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"bgroup-body\">\n        ${g.sections.map(sec=>`\n          ${sec.title?`<div class=\"bsec\">${sec.title}<\u002Fdiv>`:''}\n          <div class=\"bchips\">\n            ${sec.items.map(it=>`<button class=\"bchip${focusedId===it.id?' sel':''}\" style=\"color:${it.color};\" onclick=\"${it.onclick}\">\n              ${it.badge?`<span class=\"bcode\">${it.badge}<\u002Fspan>`:''}\n              <span class=\"bchip-name\" style=\"color:var(--text-mid);\">${it.name}${it.code?`<span style=\"color:var(--text-faint);font-weight:600;\"> · ${it.code}<\u002Fspan>`:''}<\u002Fspan>\n              ${it.extra||''}\n              <span class=\"bchip-meta\">${it.meta||''}<\u002Fspan>\n            <\u002Fbutton>`).join('')}\n          <\u002Fdiv>`).join('')}\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join('');\n}\nwindow.renderBoard = renderBoard;\n\n// ================================================================\n// ANIMATE\n// ================================================================\nfunction animate(){\n  requestAnimationFrame(animate);\n  if(layout==='board') return;\n  simulate();\n  updatePositions();\n  updateHalos();\n  if(autoRotate){orbit.theta+=0.0015;applyOrbit();}\n  renderer.render(scene,camera);\n}\n\n// ================================================================\n// INIT\n// ================================================================\norbit.theta=0; orbit.phi=Math.PI/2; applyOrbit();\nsetViewMode('competency');\nanimate();\nsetLayout(layout);\nrenderWotdList();\n\n// ================================================================\n// GUIDED TOUR\n// ================================================================\nconst TOUR = [\n  { el:null, title:'Welcome to the Science CC Map',\n    text:'This shows how the 21st Century Competencies connect to every activity in the P3–P6 Activity Books — 145 activities, all four books built in. Let me show you around; it takes about a minute.',\n    action:()=>{ clearFocus(); clearActivityFilter(); setLayout('board'); setViewMode('competency'); } },\n\n  { el:'#layout-toggle', title:'Board and Map',\n    text:'Board is the everyday view — everything grouped and readable as lists. Map is the same data as a 3D web, useful for spotting clusters. The lit-up button is the one you are in.',\n    action:()=>{ setLayout('board'); } },\n\n  { el:'#view-tabs', title:'Three ways to read the same map',\n    text:'21st CC Competencies groups by competency. Primary Level shows all 145 activities by level. Ways of Thinking & Doing gives you the eight science process skills. Switch any time — the lit tab is where you are.',\n    action:()=>{ setLayout('board'); setViewMode('competency'); } },\n\n  { el:'.bgroup', title:'Plain-English competencies',\n    text:'Each row is one competency in everyday words — Communicates Ideas, Reasons with Evidence — with its official code beside it. A yellow SYL badge marks the four the syllabus says develop naturally in science; the rest depend on how you run the lesson.',\n    action:()=>{ setLayout('board'); setViewMode('competency'); } },\n\n  { el:'#board-group', title:'Group by level or theme',\n    text:'In the Activities view you can group by primary level, or by the five syllabus themes — Diversity, Cycles, Systems, Energy, Interactions — to see a strand run from P3 to P6 in one column.',\n    action:()=>{ setLayout('board'); setViewMode('activity'); } },\n\n  { el:'.bgroup', title:'Every activity, numbered',\n    text:'Rows carry the book\\u2019s own number — 1.1, 2.1A, CFU2, TA1 — plus the page and small dots for the process skills it builds. Click any row to open its full details.',\n    action:()=>{ setLayout('board'); setViewMode('activity'); } },\n\n  { el:'#info-panel', spot:'panel-top',\n    title:'Details, activities first',\n    text:'The panel puts the activities and experiments first, because that is what you plan lessons around. Tap 📄 on any activity to open that exact page from the book, or ✏ to correct a tag — your change is saved.',\n    action:()=>{ setLayout('board'); setViewMode('competency'); focusTeacher(7); } },\n\n  { el:'#search-wrap', title:'Search across everything',\n    text:'Type two or more letters to search competencies, activity names, official codes, chapters and tags at once. Results are labelled by type — pick one to jump straight there.',\n    action:()=>{ clearFocus(); } },\n\n  { el:'#saves-list', title:'Save a view to come back to',\n    text:'Save the view you are in, the item in focus and any filters. Useful for setting something up before a department meeting and returning to it later.',\n    action:()=>{ document.getElementById('sidebar').scrollTop=200; } },\n\n  { el:'#notes-btn', title:'Notes that link back',\n    text:'Jot down planning thoughts. Type a competency inside double brackets — like [[Reasons with Evidence]] — and it becomes a clickable chip that takes you straight back to it.',\n    action:()=>{} },\n\n  { el:'#theme-toggle', title:'Day and night',\n    text:'Switch themes for a bright classroom projector or a dim room — colours and contrast are tuned separately for each. That is everything; press ? any time to see this again.',\n    action:()=>{} },\n];\n\nlet tourIdx=-1, tourActive=false;\nfunction startTour(){\n  tourActive=true; tourIdx=-1;\n  document.getElementById('help-btn').classList.remove('nudge');\n  document.getElementById('tour-veil').classList.add('show');\n  document.getElementById('tour-skip').classList.add('show');\n  tourNext();\n}\nwindow.startTour=startTour;\n\nfunction endTour(){\n  tourActive=false;\n  ['tour-veil','tour-ring','tour-card','tour-skip'].forEach(id=>\n    document.getElementById(id).classList.remove('show'));\n  Store.set('scienceMapTourSeen','1');\n  autoRotate = groupBy!=='hierarchy';\n}\nwindow.endTour=endTour;\nwindow.tourNext=function(){ if(tourIdx<TOUR.length-1){ tourIdx++; renderTourStep(); } else endTour(); };\nwindow.tourPrev=function(){ if(tourIdx>0){ tourIdx--; renderTourStep(); } };\n\nfunction renderTourStep(){\n  const s=TOUR[tourIdx];\n  if(s.action) try{ s.action(); }catch(e){ console.warn('tour step',e); }\n\n  const ring=document.getElementById('tour-ring');\n  const card=document.getElementById('tour-card');\n  card.classList.remove('show'); void card.offsetWidth; card.classList.add('show');\n\n  // --- position the spotlight ---\n  let r=null;\n  if(s.spot && typeof s.spot==='object'){\n    const vw=window.innerWidth, vh=window.innerHeight;\n    r={ left:vw*(s.spot.x-s.spot.w/2), top:vh*(s.spot.y-s.spot.h/2),\n        width:vw*s.spot.w, height:vh*s.spot.h };\n  } else if(s.el){\n    const node=document.querySelector(s.el);\n    if(node){\n      const b=node.getBoundingClientRect();\n      if(b.width>0){\n        // for the info panel, spotlight just its top portion (the activities block)\n        const h = (s.spot==='panel-top') ? Math.min(b.height, 330) : b.height;\n        r={ left:b.left-6, top:Math.max(8, b.top-6), width:b.width+12,\n            height:Math.min(h+12, window.innerHeight-Math.max(8,b.top-6)-8) };\n      }\n    }\n  }\n  if(r){\n    ring.classList.add('show');\n    Object.assign(ring.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});\n  } else ring.classList.remove('show');\n  // the ring's own 4000px shadow does all the dimming; the veil would grey out\n  // the spotlit element too, so it only runs on ringless steps\n  document.getElementById('tour-veil').style.opacity = r ? '0' : '1';\n\n  // --- position the card, keeping it on screen ---\n  const cw=325, ch=environmentCardHeight();\n  const vw=window.innerWidth, vh=window.innerHeight, gap=18;\n  let cx, cy;\n  if(r){\n    const spaceRight = vw-(r.left+r.width), spaceLeft = r.left;\n    const spaceBelow = vh-(r.top+r.height), spaceAbove = r.top;\n    if(spaceRight > cw+gap){                       // right of the target\n      cx = r.left+r.width+gap;\n      cy = Math.min(Math.max(16, r.top), vh-ch-16);\n    } else if(spaceLeft > cw+gap){                 // left of the target\n      cx = r.left-cw-gap;\n      cy = Math.min(Math.max(16, r.top), vh-ch-16);\n    } else if(spaceBelow > ch+gap){                // below, never overlapping\n      cx = Math.min(Math.max(16, r.left), vw-cw-16);\n      cy = r.top+r.height+gap;\n    } else if(spaceAbove > ch+gap){                // above\n      cx = Math.min(Math.max(16, r.left), vw-cw-16);\n      cy = r.top-ch-gap;\n    } else {                                       // nowhere clear — hug the wider side\n      cx = spaceRight >= spaceLeft ? Math.max(16, vw-cw-16) : 16;\n      cy = Math.min(Math.max(16, r.top), vh-ch-16);\n    }\n  } else {\n    cx = (vw-cw)/2;\n    cy = (vh-ch)/2;\n  }\n  Object.assign(card.style,{left:cx+'px',top:cy+'px'});\n\n  // --- content ---\n  document.getElementById('tour-step').textContent=`Step ${tourIdx+1} of ${TOUR.length}`;\n  document.getElementById('tour-title').textContent=s.title;\n  document.getElementById('tour-text').textContent=s.text;\n  document.getElementById('tour-dots').innerHTML=\n    TOUR.map((_,i)=>`<div class=\"tour-dot ${i===tourIdx?'on':''}\"><\u002Fdiv>`).join('');\n  document.getElementById('tour-back').style.visibility = tourIdx===0?'hidden':'visible';\n  document.getElementById('tour-next').textContent = tourIdx===TOUR.length-1?'Done':'Next';\n}\nfunction environmentCardHeight(){\n  const c=document.getElementById('tour-card');\n  return c.offsetHeight || 210;\n}\nwindow.addEventListener('resize',()=>{ if(tourActive) renderTourStep(); });\ndocument.addEventListener('keydown',e=>{\n  if(!tourActive) return;\n  if(e.key==='Escape') endTour();\n  if(e.key==='ArrowRight'||e.key==='Enter') tourNext();\n  if(e.key==='ArrowLeft') tourPrev();\n});\n\n// first visit -> nudge the help button, and auto-open the tour once\nif(!Store.get('scienceMapTourSeen',null)){\n  setTimeout(()=>{ if(!tourActive) startTour(); }, 900);\n} else {\n  setTimeout(()=>document.getElementById('help-btn').classList.add('nudge'), 1500);\n}\n\n// ================================================================\n// THEME TOGGLE\n// ================================================================\nwindow.toggleTheme=function(){\n  isDayMode=!isDayMode;\n  document.body.classList.toggle('day',isDayMode);\n  const btn=document.getElementById('theme-toggle');\n  btn.textContent=isDayMode?'☀️':'🌙';\n  btn.title=isDayMode?'Switch to night mode':'Switch to day mode';\n  renderer.setClearColor(isDayMode?0xeef2fb:0x070b18,1);\n  scene.fog.color.setHex(isDayMode?0xeef2fb:0x070b18);\n\n  // re-render everything that bakes colours into markup\n  buildHierarchyLabels();\n  updateLegend();\n  renderBooks();\n  renderWotdList();\n  if(focusedId) focusTeacher(focusedId);\n  if(pdfModalActivity) renderModalCompetencies(pdfModalActivity);\n};\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
