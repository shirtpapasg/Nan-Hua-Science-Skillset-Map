document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"UTF-8\">\n<title>Science CC Map 2024<\u002Ftitle>\n<style>\n/* ================= THEME TOKENS ================= */\n:root {\n  --bg:          #070b18;\n  --panel:       rgba(11,17,38,0.985);\n  --panel-solid: #0b1126;\n  --card:        rgba(80,100,200,0.05);\n  --hover:       rgba(80,100,200,0.13);\n  --line:        rgba(96,116,205,0.22);\n  --line-strong: rgba(96,116,205,0.34);\n  --text:        #eef2ff;   /* headings            */\n  --text-mid:    #b3c0e0;   /* body copy           */\n  --text-dim:    #7d8db5;   /* labels / secondary  */\n  --text-faint:  #5d6d95;   /* tertiary            */\n  --accent:      #6f9bff;\n  --accent-soft: rgba(111,155,255,0.16);\n  --tag-text:    #7fd4a3;\n  --cyan:        #4fd8ff;\n  --cyan-soft:   rgba(79,216,255,0.10);\n}\nbody.day {\n  --bg:          #eef2fb;\n  --panel:       rgba(255,255,255,0.985);\n  --panel-solid: #ffffff;\n  --card:        rgba(40,70,160,0.045);\n  --hover:       rgba(40,70,160,0.10);\n  --line:        rgba(40,70,160,0.20);\n  --line-strong: rgba(40,70,160,0.34);\n  --text:        #0e1836;\n  --text-mid:    #33436e;\n  --text-dim:    #5a6a92;\n  --text-faint:  #7787ad;\n  --accent:      #2354d6;\n  --accent-soft: rgba(35,84,214,0.11);\n  --tag-text:    #17734a;\n  --cyan:        #0678a4;\n  --cyan-soft:   rgba(6,120,164,0.09);\n}\n\n*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\nhtml, body { width:100%; height:100%; overflow:hidden; background:var(--bg); font-family:-apple-system,'Segoe UI',sans-serif; color:var(--text-mid); font-size:13px; -webkit-font-smoothing:antialiased; }\n#canvas { position:fixed; top:0; left:220px; }\n\n/* ---- Sidebar ---- */\n#sidebar {\n  position:fixed; top:0; left:0; width:220px; height:100vh;\n  background:rgba(7,11,24,0.97); border-right:1px solid var(--line);\n  padding:14px 13px; overflow-y:auto; z-index:20;\n  display:flex; flex-direction:column; gap:13px;\n}\n.app-title { font-size:15px; font-weight:700; color:var(--text); display:flex; align-items:center; gap:7px; }\n#node-count { font-size:11px; color:var(--text-faint); margin-top:2px; }\n#add-btn { width:100%; padding:9px; background:rgba(80,120,255,0.18); border:1px solid rgba(80,120,255,0.45); color:#99bbff; border-radius:7px; cursor:pointer; font-size:12px; font-weight:600; transition:all .2s; }\n#add-btn:hover { background:rgba(80,120,255,0.32); color:var(--text); }\n#search-input { width:100%; padding:7px 10px; background:var(--card); border:1px solid var(--line); color:var(--text-mid); border-radius:6px; font-size:12px; font-family:inherit; }\n#search-input:focus { outline:none; border-color:rgba(80,120,255,0.5); }\n#search-input::placeholder { color:var(--text-faint); }\nselect { width:100%; padding:7px 10px; background:var(--card); border:1px solid var(--line); color:var(--text-mid); border-radius:6px; font-size:12px; font-family:inherit; appearance:none; cursor:pointer; }\nselect:focus { outline:none; border-color:rgba(80,120,255,0.5); }\n.section-label { font-size:10px; text-transform:uppercase; letter-spacing:1.2px; color:var(--text-faint); font-weight:700; }\n.section-header { display:flex; align-items:center; justify-content:space-between; cursor:pointer; user-select:none; }\n.section-header:hover .section-label { color:var(--text-dim); }\n.toggle-arrow { font-size:10px; color:var(--text-faint); transition:transform .2s; }\n.legend-item { display:flex; align-items:center; gap:7px; padding:3px 0; }\n.legend-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }\n.legend-label { font-size:12px; color:var(--text-dim); }\n.legend-count { margin-left:auto; font-size:11px; color:var(--text-faint); background:var(--card); border-radius:10px; padding:0 6px; }\n\n/* Tag Points Panel */\n#tag-points-panel { padding-top:8px; }\n.tp-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:5px; }\n.tp-label { font-size:12px; color:var(--tag-text); }\n.tp-controls { display:flex; align-items:center; gap:0; }\n.tp-btn { width:22px; height:22px; background:var(--hover); border:1px solid var(--line-strong); color:#7788cc; cursor:pointer; font-size:14px; line-height:1; display:flex; align-items:center; justify-content:center; transition:all .15s; }\n.tp-btn:first-child { border-radius:4px 0 0 4px; border-right:none; }\n.tp-btn:last-child  { border-radius:0 4px 4px 0; border-left:none; }\n.tp-btn:hover { background:var(--hover); color:#aabbff; }\n.tp-val { width:28px; height:22px; text-align:center; background:var(--card); border:1px solid var(--line-strong); color:var(--text-mid); font-size:12px; font-family:inherit; }\n.tp-val:focus { outline:none; border-color:rgba(80,120,255,0.5); }\n.tp-hint { font-size:10px; color:var(--text-faint); line-height:1.4; margin-bottom:6px; }\n\n/* Connection legend */\n.conn-legend-item { display:flex; align-items:center; gap:7px; padding:3px 0; }\n.conn-line { width:22px; height:2px; border-radius:1px; flex-shrink:0; }\n\n/* Tag chips */\n.tag-chip { display:inline-flex; align-items:center; background:rgba(80,180,120,0.08); border:1px solid rgba(80,180,120,0.28); border-radius:12px; padding:3px 9px; font-size:11px; color:var(--tag-text); cursor:pointer; margin:2px; transition:all .2s; }\n.tag-chip.active { background:rgba(80,180,120,0.22); border-color:rgba(80,180,120,0.6); color:#99eeaa; }\n.tag-chip:hover { background:rgba(80,180,120,0.18); }\n\n/* ---- Info Panel ---- */\n#info-panel {\n  position:fixed; top:0; right:0; width:310px; height:100vh;\n  background:rgba(6,9,20,0.97); border-left:1px solid var(--line);\n  padding:20px 17px; overflow-y:auto; z-index:20;\n  transform:translateX(100%); transition:transform .3s cubic-bezier(.4,0,.2,1);\n}\n#info-panel.open { transform:translateX(0); }\n.info-name { font-size:18px; font-weight:700; color:var(--text); line-height:1.2; }\n.subject-badge { display:inline-flex; align-items:center; gap:6px; border-radius:5px; padding:4px 12px; font-size:12px; font-weight:600; border-width:1px; border-style:solid; margin-top:7px; }\n.pts-bar-wrap { background:rgba(80,100,200,0.1); border-radius:4px; height:6px; margin-top:5px; overflow:hidden; }\n.pts-bar { height:100%; border-radius:4px; background:linear-gradient(90deg,#4488ff,#44ddff); transition:width .4s; }\n.info-section { margin-top:16px; }\n.info-section-label { font-size:10px; text-transform:uppercase; letter-spacing:1.2px; color:var(--text-faint); margin-bottom:7px; font-weight:700; }\n.project-item { display:flex; align-items:flex-start; gap:8px; background:rgba(80,100,200,0.07); border-left:2px solid; padding:6px 10px; margin-bottom:4px; border-radius:0 5px 5px 0; font-size:12px; color:var(--text-mid); }\n.connected-item { display:flex; align-items:center; gap:9px; padding:7px 8px; border-radius:6px; cursor:pointer; transition:background .15s; margin-bottom:2px; }\n.connected-item:hover { background:var(--card); }\n.info-actions { display:flex; gap:8px; padding-top:15px; border-top:1px solid var(--card); margin-top:16px; }\n.info-btn-edit { flex:1; padding:8px; background:rgba(80,120,255,0.12); border:1px solid rgba(80,120,255,0.32); color:#8899cc; border-radius:6px; cursor:pointer; font-size:12px; transition:all .2s; }\n.info-btn-edit:hover { background:rgba(80,120,255,0.22); color:var(--text); }\n.info-btn-del { padding:8px 12px; background:rgba(255,60,60,0.08); border:1px solid rgba(255,60,60,0.22); color:#cc5555; border-radius:6px; cursor:pointer; font-size:12px; }\n.info-btn-del:hover { background:rgba(255,60,60,0.18); color:#ff7777; }\n.close-btn { float:right; background:none; border:1px solid var(--line); color:#5566aa; border-radius:4px; padding:2px 8px; cursor:pointer; font-size:13px; }\n.close-btn:hover { color:var(--text); }\n\n/* ---- Hierarchy labels ---- */\n#hier-labels { position:fixed; top:0; left:220px; width:175px; height:100vh; pointer-events:none; z-index:15; display:none; }\n.tier-label { position:absolute; left:8px; background:rgba(5,8,18,0.82); border-left:2px solid rgba(80,120,255,0.35); padding:3px 10px 3px 8px; font-size:10px; color:#445588; text-transform:uppercase; letter-spacing:0.8px; white-space:nowrap; transform:translateY(-50%); border-radius:0 4px 4px 0; }\n#hier-legend { margin-top:6px; }\n.tier-row { display:flex; align-items:center; gap:6px; padding:2px 0; }\n.tier-dot { width:6px; height:6px; border-radius:50%; background:rgba(80,120,255,0.5); flex-shrink:0; }\n.tier-name { font-size:11px; color:var(--text-faint); }\n.tier-rank { margin-left:auto; font-size:10px; color:var(--text-faint); }\n\n/* ---- Modal ---- */\n#modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.78); z-index:50; display:none; align-items:center; justify-content:center; }\n#modal-overlay.open { display:flex; }\n#modal { background:#0c1022; border:1px solid rgba(80,120,255,0.28); border-radius:14px; padding:24px; width:480px; max-height:85vh; overflow-y:auto; box-shadow:0 30px 80px rgba(0,0,20,.9); }\n.modal-title { font-size:16px; font-weight:700; color:var(--text); margin-bottom:20px; }\n.form-row { margin-bottom:14px; }\n.form-label { display:block; font-size:10px; text-transform:uppercase; letter-spacing:1.1px; color:var(--text-faint); margin-bottom:5px; font-weight:700; }\n.form-input { width:100%; padding:8px 12px; background:rgba(80,100,200,0.07); border:1px solid var(--line); color:var(--text-mid); border-radius:7px; font-size:13px; font-family:inherit; transition:border .2s; }\n.form-input:focus { outline:none; border-color:rgba(80,120,255,0.5); }\n.form-2col { display:grid; grid-template-columns:1fr 1fr; gap:12px; }\n.tags-input-container { display:flex; flex-wrap:wrap; gap:4px; min-height:38px; padding:5px 8px; background:rgba(80,100,200,0.07); border:1px solid var(--line); border-radius:7px; cursor:text; }\n.tags-input-container:focus-within { border-color:rgba(80,120,255,0.5); }\n.tag-input-chip { display:flex; align-items:center; gap:4px; background:rgba(80,180,120,0.14); border:1px solid rgba(80,180,120,0.38); border-radius:10px; padding:2px 8px; font-size:12px; color:#88ddaa; }\n.tag-remove { cursor:pointer; color:#55886a; font-size:15px; line-height:1; }\n.tag-remove:hover { color:#ff6666; }\n#new-tag-input { border:none; background:none; color:var(--text-mid); font-size:13px; outline:none; min-width:80px; flex:1; font-family:inherit; padding:2px 0; }\n.projects-list { display:flex; flex-direction:column; gap:5px; }\n.project-row { display:flex; gap:6px; align-items:center; }\n.project-row .form-input { flex:1; }\n.remove-project { background:rgba(255,60,60,0.1); border:1px solid rgba(255,60,60,0.25); color:#cc5555; border-radius:5px; padding:7px 10px; cursor:pointer; font-size:13px; }\n.remove-project:hover { background:rgba(255,60,60,0.2); color:#ff7777; }\n.add-project-btn { background:rgba(80,120,255,0.07); border:1px dashed rgba(80,120,255,0.28); color:var(--text-dim); border-radius:6px; padding:7px; cursor:pointer; font-size:12px; width:100%; margin-top:5px; }\n.add-project-btn:hover { background:rgba(80,120,255,0.14); color:#99aacc; }\n.modal-actions { display:flex; gap:10px; margin-top:20px; padding-top:16px; border-top:1px solid var(--card); }\n.btn-primary { flex:1; padding:10px; background:rgba(80,120,255,0.25); border:1px solid rgba(80,120,255,0.5); color:#99bbff; border-radius:8px; cursor:pointer; font-size:13px; font-weight:600; }\n.btn-primary:hover { background:rgba(80,120,255,0.4); color:var(--text); }\n.btn-secondary { padding:10px 16px; background:none; border:1px solid rgba(80,100,200,0.25); color:var(--text-dim); border-radius:8px; cursor:pointer; font-size:13px; }\n.btn-secondary:hover { border-color:rgba(80,100,200,0.45); color:#aabbdd; }\n\n/* ---- Board (flat 2D view) ---- */\n#board {\n  position:fixed; top:0; left:220px; right:0; bottom:0; z-index:12;\n  overflow-y:auto; padding:56px 90px 60px 28px; display:none;\n  background:var(--bg);\n}\n#board.on { display:block; }\n#board-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:18px; align-items:start; max-width:1600px; margin:0 auto; }\n.bgroup { background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,20,.25); }\n.bgroup-rail { height:2px; width:100%; background:currentColor; opacity:.85; }\n.bgroup-head {\n  display:flex; align-items:center; gap:10px; padding:13px 16px;\n  border-bottom:1px solid var(--line); position:sticky; top:-1px; z-index:2;\n  background:var(--panel); backdrop-filter:blur(6px);\n}\n.bgroup-dot { display:none; }\n.bgroup-name { font-size:11.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; flex:1; min-width:0; }\n.bgroup-count { font-size:10.5px; font-weight:700; color:var(--text-faint); background:var(--card); border-radius:20px; padding:2px 9px; flex-shrink:0; font-variant-numeric:tabular-nums; }\n.bgroup-body { padding:6px 10px 12px; }\n.bsec {\n  font-size:9.5px; text-transform:uppercase; letter-spacing:.11em; color:var(--text-faint);\n  font-weight:700; margin:14px 0 7px; padding:0 4px; display:flex; align-items:center; gap:8px;\n}\n.bsec::after { content:''; flex:1; height:1px; background:var(--line); }\n.bsec:first-child { margin-top:8px; }\n.bchips { display:flex; flex-direction:column; gap:3px; }\n.bchip {\n  display:flex; align-items:center; gap:9px; width:100%;\n  background:transparent; border:none; border-left:2px solid transparent;\n  border-radius:0 7px 7px 0; padding:8px 10px; cursor:pointer;\n  font-size:13px; color:var(--text-mid); text-align:left;\n  transition:background .12s, border-color .12s, padding-left .12s;\n}\n.bchip:hover { background:var(--hover); border-left-color:currentColor; padding-left:13px; }\n.bchip.sel { background:var(--accent-soft); border-left-color:var(--accent); color:var(--text); padding-left:13px; }\n.bchip-name { flex:1; min-width:0; font-weight:500; line-height:1.4; }\n.bcode {\n  flex-shrink:0; font-size:10px; font-weight:800; letter-spacing:.01em; color:var(--text-faint);\n  border:1px solid var(--line); border-radius:5px; padding:2px 5px; min-width:36px;\n  text-align:center; font-variant-numeric:tabular-nums;\n}\n.bchip:hover .bcode, .bchip.sel .bcode { color:var(--text-mid); border-color:var(--line-strong); }\n.bchip-meta { font-size:10px; color:var(--text-dim); flex-shrink:0; font-variant-numeric:tabular-nums; }\n.bchip-skills { display:flex; gap:3px; flex-shrink:0; }\n.bskill-dot { width:5px; height:5px; border-radius:50%; }\n#board-empty { text-align:center; color:var(--text-faint); font-size:13px; padding:60px 20px; }\n\n/* layout toggle */\n#layout-toggle {\n  position:fixed; top:14px; right:20px; z-index:22; display:flex;\n  background:var(--panel); border:1px solid var(--line-strong); border-radius:9px; padding:3px; gap:2px;\n  box-shadow:0 6px 22px rgba(0,0,25,.5);\n}\n#layout-toggle button {\n  background:none; border:none; color:var(--text-dim); font-family:inherit;\n  font-size:11.5px; font-weight:700; padding:6px 13px; border-radius:6px; cursor:pointer; transition:all .15s;\n}\n#layout-toggle button:hover { color:var(--text); }\n#layout-toggle button.on {\n  color:#0a1030; font-weight:800;\n  background:linear-gradient(90deg,#ff4455,#ffaa33,#ffdd33,#33cc77,#33ddff,#4488ff,#aa55ff,#ff44aa,#ff4455);\n  background-size:400% 100%;\n  animation:rainbow-slide 4.5s linear infinite;\n  box-shadow:0 0 0 1px rgba(255,255,255,.25), 0 2px 14px rgba(120,140,255,.35);\n}\n@keyframes rainbow-slide { from { background-position:0% 50%; } to { background-position:400% 50%; } }\n@media (prefers-reduced-motion:reduce) {\n  #layout-toggle button.on, #board-group button.on, .view-tab.on { animation:none; background-position:20% 50%; }\n}\n#board-title { max-width:1600px; margin:0 auto 12px; font-size:11.5px; color:var(--text-faint); letter-spacing:.04em; }\n#board-group { max-width:1600px; margin:0 auto 20px; display:flex; align-items:center; gap:6px; }\n#board-group > span { font-size:10px; text eyframes tourFade { from{opacity:0} to{opacity:1} }\n\n/* moving spotlight ring */\n#tour-ring {\n  position:fixed; z-index:81; border-radius:12px; pointer-events:none;\n  border:3px solid #7fe7ff;\n  background:radial-gradient(ellipse at center, rgba(140,220,255,.15), rgba(140,220,255,.05) 62%, transparent 78%);\n  box-shadow:0 0 0 4000px rgba(3,6,18,0.86),\n             inset 0 0 30px rgba(160,230,255,.26),\n             0 0 0 1px rgba(255,255,255,.5),\n             0 0 34px rgba(127,231,255,.85),\n             0 0 90px rgba(127,231,255,.32);\n  transition:all .55s cubic-bezier(.5,.05,.2,1); display:none;\n}\nbody.day #tour-ring {\n  border-color:#0088bb;\n  background:radial-gradient(ellipse at center, rgba(255,255,255,.45), rgba(255,255,255,.12) 62%, transparent 78%);\n  box-shadow:0 0 0 4000px rgba(20,30,70,0.58),\n             inset 0 0 30px rgba(255,255,255,.45),\n             0 0 0 1px rgba(255,255,255,.8),\n             0 0 30px rgba(0,140,190,.6);\n}\n#tour-ring.show { display:block; animation:ringPulse 2s ease-in-out infinite; }\n@keyframes ringPulse {\n  0%,100% { border-color:#7fe7ff; }\n  50%     { border-color:#ffffff; }\n}\n\n/* tooltip card */\n#tour-card {\n  position:fixed; z-index:83; width:325px; max-width:88vw;\n  background:var(--panel-solid); border:1px solid var(--line-strong); border-radius:13px;\n  padding:17px 19px; box-shadow:0 22px 60px rgba(0,0,30,.65);\n  transition:all .55s cubic-bezier(.5,.05,.2,1); display:none;\n}\n#tour-card.show { display:block; animation:cardIn .45s cubic-bezier(.3,1.3,.5,1); }\n@keyframes cardIn { from{opacity:0;transform:translateY(10px) scale(.97)} to{opacity:1;transform:none} }\n#tour-step   { font-size:10px; letter-spacing:.13em; text-transform:uppercase; font-weight:800; color:var(--cyan); margin-bottom:6px; }\n#tour-title  { font-size:16px; font-weight:700; color:var(--text); margin-bottom:7px; }\n#tour-text   { font-size:12.5px; color:var(--text-mid); line-height:1.65; }\n#tour-foot   { display:flex; al ding:18px; }\n}\n\n/* ---- scrollbars follow the theme ---- */\n::-webkit-scrollbar { width:9px; height:9px; }\n::-webkit-scrollbar-track { background:transparent; }\n::-webkit-scrollbar-thumb { background:var(--line); border-radius:5px; }\n::-webkit-scrollbar-thumb:hover { background:var(--line-strong); }\n\n/* ---- visible keyboard focus everywhere ---- */\nbutton:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible,\n.cc-card:focus-visible, .act-pill:focus-visible {\n  outline:2px solid var(--accent); outline-offset:2px;\n}\n\n/* day mode extras */\nbody.day #activity-bar { background:rgba(220,228,248,0.97); border-top-color:rgba(0,160,200,0.4); }\nbody.day #activity-bar-label { color:var(--text-mid); }\nbody.day #activity-bar-label strong { color:var(--cyan); }\nbody.day #activity-bar-clear { border-color:rgba(0,160,200,0.35); color:#006688; }\nbody.day #notes-panel { background:rgba(234,240,255,0.99); border-left-color:rgba(170,85,255,0.2); }\nbody.day .note-card { background:rgba(80,80,200,0.04); border-color:rgba(80,100,200,0.14); }\nbody.day .note-body-rendered { color:var(--text-mid); }\nbody.day .note-title-input, body.day .note-body-input { color:var(--text); }\nbody.day .act-pill { background:rgba(0,160,200,0.05); border-color:rgba(0,160,200,0.2); }\nbody.day .act-pill:hover { background:rgba(0,160,200,0.12); border-color:rgba(0,160,200,0.4); }\nbody.day .act-pill-label { color:var(--cyan); }\nbody.day .act-pill-count { color:#6080a0; background:rgba(0,160,200,0.08); }\nbody.day .save-item { background:var(--card); border-color:rgba(80,100,200,0.14); }\nbody.day .save-name { color:#1a2040; }\nbody.day #notes-btn { background:rgba(170,85,255,0.1); border-color:rgba(170,85,255,0.3); color:#884ecc; }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n<canvas id=\"canvas\"><\u002Fcanvas>\n<div id=\"board\">\n  <div id=\"board-title\"><\u002Fdiv>\n  <div id=\"board-group\">\n    <span>Group by<\u002Fspan>\n    <button id=\"bg-level\" class=\"on\" onclick=\"setBoardGroup('level')\">Level<\u002Fbutton>\n    <button id=\"bg-theme\" onclick=\"setBoardGroup('theme')\">Theme<\u002Fbutton>\n  <\u002Fdiv>\n  <div id=\"board-grid\"><\u002Fdiv>\n<\u002Fdiv>\n<div id=\"layout-toggle\">\n  <button id=\"lt-map\" onclick=\"setLayout('map')\">Map<\u002Fbutton>\n  <button id=\"lt-board\" class=\"on\" onclick=\"setLayout('board')\">Board<\u002Fbutton>\n<\u002Fdiv>\n<div id=\"tooltip\"><\u002Fdiv>\n<div id=\"hint\">Drag to rotate · Scroll to zoom · Click a node to focus<\u002Fdiv>\n<div id=\"hier-labels\"><\u002Fdiv>\n\n<!-- ======== SIDEBAR ======== -->\n<div id=\"sidebar\">\n  <div>\n    <div class=\"app-title\">🔬 Science CC Map<\u002Fdiv>\n    <div id=\"node-count\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- VIEW SWITCHER -->\n  <div>\n    <div class=\"section-label\" style=\"margin-bottom:5px;\">View<\u002Fdiv>\n    <div id=\"view-tabs\">\n      <div class=\"view-tab on\" data-mode=\"competency\" onclick=\"setViewMode('competency')\">\n        <span class=\"vt-dot\" style=\"background:#aa55ff;\"><\u002Fspan><span>21st CC Competencies<\u002Fspan><\u002Fdiv>\n      <div class=\"view-tab\" data-mode=\"activity\" onclick=\"setViewMode('activity')\">\n        <span class=\"vt-dot\" style=\"background:#4488ff;\"><\u002Fspan><span>Primary Level — Activities<\u002Fspan><\u002Fdiv>\n      <div class=\"view-tab\" data-mode=\"wotd\" onclick=\"setViewMode('wotd')\">\n        <span class=\"vt-dot\" style=\"background:#33cc77;\"><\u002Fspan><span>Ways of Thinking &amp; Doing<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"search-wrap\">\n    <input type=\"text\" id=\"search-input\" placeholder=\"🔍  Search names, activities, tags…\">\n    <div id=\"search-dropdown\"><\u002Fdiv>\n  <\u002Fdiv>\n  <button id=\"add-btn\">＋ Add Competency<\u002Fbutton>\n\n  <!-- Saved Views -->\n  <div>\n    <div class=\"section-label\" style=\"margin-bottom:5px;\">📌 Saved Views<\u002Fdiv>\n    <div id=\"saves-list\" style=\"margin-bottom:4px;\"><\u002Fdiv>\n    <button class=\"save-view-btn\" onclick=\"saveCurrentView()\">＋ Save Current View<\u002Fbutton>\n  <\u002Fdiv>\n\n  <!-- Activity Books -->\n  <div>\n    <div class=\"section-label\" style=\"margin-bottom:5px;\">📚 Activity Books<\u002Fdiv>\n    <div style=\"font-size:10px;color:var(--text-faint);margin-bottom:6px;line-height:1.4;\">All four books are built in — page previews work straight away.<\u002Fdiv>\n    <div id=\"books-list\"><\u002Fdiv>\n    <button onclick=\"resetAllPages()\" style=\"width:100%;margin-top:5px;padding:5px;background:none;border:1px solid rgba(255,90,90,0.2);color:var(--text-faint);border-radius:5px;cursor:pointer;font-size:10px;font-family:inherit;\">↺ Reset edited page numbers<\u002Fbutton>\n  <\u002Fdiv>\n\n  <div>\n    <div class=\"section-label\" style=\"margin-bottom:6px;\">Arrange By<\u002Fdiv>\n    <select id=\"group-by\">\n      <option value=\"hierarchy\">Hierarchy (tier)<\u002Foption>\n      <option value=\"subject\">Domain<\u002Foption>\n      <option value=\"role\">Category type<\u002Foption>\n      <option value=\"none\">None (organic)<\u002Foption>\n    <\u002Fselect>\n  <\u002Fdiv>\n\n  <!-- Tag Points -->\n  <div>\n    <div class=\"section-header\" onclick=\"toggleTagPoints()\" style=\"margin-bottom:0;\">\n      <div class=\"section-label\">🏷 Tag Points<\u002Fdiv>\n      <span class=\"toggle-arrow\" id=\"tp-toggle\">▶<\u002Fspan>\n    <\u002Fdiv>\n    <div id=\"tag-points-panel\" style=\"display:none;\">\n      <p class=\"tp-hint\" style=\"margin-top:6px;\">Points per tag affect node size. Higher pts = bigger node.<\u002Fp>\n      <div id=\"tp-list\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- WOTD filter -->\n  <div>\n    <div class=\"section-label\" style=\"margin-bottom:5px;\">🔬 Ways of Thinking &amp; Doing<\u002Fdiv>\n    <div style=\"font-size:10px;color:var(--text-faint);margin-bottom:6px;line-height:1.4;\">Science process skills. Click to show only competencies whose activities build that skill.<\u002Fdiv>\n    <div id=\"wotd-list\"><\u002Fdiv>\n    <button onclick=\"resetAllWotd()\" style=\"width:100%;margin-top:5px;padding:5px;background:none;border:1px solid rgba(255,90,90,0.2);color:var(--text-faint);border-radius:5px;cursor:pointer;font-size:10px;font-family:inherit;\">↺ Reset edited skill tags<\u002Fbutton>\n  <\u002Fdiv>\n\n  <!-- Domain Legend -->\n  <div>\n    <div class=\"section-label\" style=\"margin-bottom:6px;\">Domain Colour<\u002Fdiv>\n    <div id=\"legend\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Connection Legend -->\n  <div>\n    <div class=\"section-label\" style=\"margin-bottom:6px;\">Connection Lines<\u002Fdiv>\n    <div class=\"conn-legend-item\"><div class=\"conn-line\" style=\"background:#33ddff;\"><\u002Fdiv><span style=\"font-size:11px;color:var(--text-dim);\">Shared activity<\u002Fspan><\u002Fdiv>\n    <div class=\"conn-legend-item\"><div class=\"conn-line\" style=\"background:#ffcc33;\"><\u002Fdiv><span style=\"font-size:11px;color:var(--text-dim);\">Same domain group<\u002Fspan><\u002Fdiv>\n    <div class=\"conn-legend-item\"><div class=\"conn-line\" style=\"background:#8899cc;opacity:0.5;\"><\u002Fdiv><span style=\"font-size:11px;color:var(--text-dim);\">Same CC type (CCI/CAIT/CGC)<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Hierarchy tiers -->\n  <div id=\"hier-sidebar\" style=\"display:block;\">\n    <div class=\"section-label\" style=\"margin-bottom:6px;\">Curriculum Tiers<\u002Fdiv>\n    <div id=\"hier-legend\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Tag Filters -->\n  <div>\n    <div class=\"section-label\" style=\"margin-bottom:6px;\">Filter by Tag<\u002Fdiv>\n    <div id=\"tag-filters\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ======== INFO PANEL ======== -->\n<div id=\"info-panel\"><\u002Fdiv>\n\n<!-- ======== ACTIVITY FILTER BAR ======== -->\n<div id=\"activity-bar\">\n  <div id=\"activity-bar-label\">🔬 Showing: <strong id=\"activity-bar-name\"><\u002Fstrong><\u002Fdiv>\n  <button id=\"activity-bar-clear\" onclick=\"clearActivityFilter()\">✕ Clear filter<\u002Fbutton>\n<\u002Fdiv>\n\n<!-- ======== PDF VIEWER MODAL ======== -->\n<div id=\"pdf-modal\" style=\"display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,20,0.88);align-items:center;justify-content:center;backdrop-filter:blur(8px);\">\n  <div id=\"pdf-modal-box\">\n    <button onclick=\"closePdfModal()\" id=\"pdf-modal-close\">✕<\u002Fbutton>\n\n    <!-- header spans both columns -->\n    <div id=\"pdf-modal-title\"><\u002Fdiv>\n\n    <div id=\"pdf-modal-body\">\n      <!-- LEFT: page preview -->\n      <div id=\"pdf-modal-left\">\n        <canvas id=\"pdf-modal-canvas\"><\u002Fcanvas>\n        <div style=\"display:flex;justify-content:center;align-items:center;gap:12px;margin-top:10px;\">\n          <button onclick=\"pdfModalPrev()\" class=\"pdfnav\">‹ Prev<\u002Fbutton>\n          <span id=\"pdf-modal-page\" style=\"font-size:12px;color:var(--text-dim);\"><\u002Fspan>\n          <button onclick=\"pdfModalNext()\" class=\"pdfnav\">Next ›<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"text-align:center;margin-top:8px;\">\n          <button id=\"pdf-modal-setpage\" onclick=\"pdfModalSetPage()\" style=\"display:none;background:rgba(85,204,136,0.12);border:1px solid rgba(85,204,136,0.4);color:#55cc88;border-radius:6px;padding:5px 16px;cursor:pointer;font-size:11px;font-family:inherit;\">✓ Use this page for this activity<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- RIGHT: competencies developed by this activity -->\n      <div id=\"pdf-modal-right\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ======== NOTES BUTTON ======== -->\n<button id=\"notes-btn\" onclick=\"toggleNotes()\" title=\"Notes\">📝<\u002Fbutton>\n\n<!-- ======== NOTES PANEL ======== -->\n<div id=\"notes-panel\">\n  <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;\">\n    <div style=\"font-size:14px;font-weight:700;color:var(--text);\">📝 Notes<\u002Fdiv>\n    <button onclick=\"toggleNotes()\" style=\"background:none;border:none;color:#445577;font-size:16px;cursor:pointer;\">✕<\u002Fbutton>\n  <\u002Fdiv>\n  <div style=\"font-size:11px;color:var(--text-faint);margin-bottom:10px;\">Tip: Use <code style=\"background:rgba(80,180,120,0.1);border-radius:3px;padding:1px 5px;\">[[CCI 1]]<\u002Fcode> to link back to a competency.<\u002Fdiv>\n  <button onclick=\"addNote()\" style=\"width:100%;padding:8px;background:rgba(170,85,255,0.08);border:1px dashed rgba(170,85,255,0.3);color:#aa77cc;border-radius:7px;cursor:pointer;font-size:12px;margin-bottom:12px;\">＋ New Note<\u002Fbutton>\n  <div id=\"notes-list\"><\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ======== WOTD TAG EDITOR ======== -->\n<div id=\"wotd-modal\" style=\"display:none;position:fixed;inset:0;z-index:55;background:rgba(0,0,20,0.85);align-items:center;justify-content:center;backdrop-filter:blur(6px);\">\n  <div style=\"background:var(--panel-solid);border:1px solid var(--line-strong);border-radius:14px;padding:22px 24px;width:min(480px,92vw);max-height:88vh;overflow-y:auto;position:relative;\">\n    <button onclick=\"closeWotdEditor()\" style=\"position:absolute;top:13px;right:15px;background:none;border:none;color:var(--text-dim);font-size:18px;cursor:pointer;\">✕<\u002Fbutton>\n    <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:var(--cyan);margin-bottom:5px;\">Edit process skills<\u002Fdiv>\n    <div id=\"wotd-edit-title\" style=\"font-size:16px;font-weight:700;color:var(--text);margin-bottom:3px;padding-right:30px;\"><\u002Fdiv>\n    <div id=\"wotd-edit-sub\" style=\"font-size:11px;color:var(--text-faint);margin-bottom:15px;\"><\u002Fdiv>\n    <div id=\"wotd-edit-list\"><\u002Fdiv>\n    <div id=\"wotd-edit-note\" style=\"font-size:11px;color:var(--text-faint);margin-top:12px;line-height:1.5;\"><\u002Fdiv>\n    <div style=\"display:flex;gap:8px;margin-top:16px;justify-content:flex-end;\">\n      <button onclick=\"resetWotdForActivity()\" class=\"tour-btn\" style=\"margin-right:auto;\">↺ Reset to syllabus<\u002Fbutton>\n      <button onclick=\"closeWotdEditor()\" class=\"tour-btn\">Cancel<\u002Fbutton>\n      <button onclick=\"saveWotdEditor()\" class=\"tour-btn primary\">Save<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ======== GUIDED TOUR ======== -->\n<div id=\"tour-veil\" onclick=\"endTour()\"><\u002Fdiv>\n<div id=\"tour-ring\"><\u002Fdiv>\n<div id=\"tour-card\">\n  <div id=\"tour-step\"><\u002Fdiv>\n  <div id=\"tour-title\"><\u002Fdiv>\n  <div id=\"tour-text\"><\u002Fdiv>\n  <div id=\"tour-foot\">\n    <div id=\"tour-dots\"><\u002Fdiv>\n    <button class=\"tour-btn\" id=\"tour-back\" onclick=\"tourPrev()\">Back<\u002Fbutton>\n    <button class=\"tour-btn primary\" id=\"tour-next\" onclick=\"tourNext()\">Next<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<button id=\"tour-skip\" onclick=\"endTour()\">Skip tour<\u002Fbutton>\n\n<!-- ======== HELP ======== -->\n<button id=\"help-btn\" onclick=\"startTour()\" title=\"Show me around\">?<\u002Fbutton>\n\n<!-- ======== THEME TOGGLE ======== -->\n<button id=\"theme-toggle\" onclick=\"toggleTheme()\" title=\"Toggle day / night mode\">🌙<\u002Fbutton>\n\n<!-- ======== MODAL ======== -->\n<div id=\"modal-overlay\">\n  <div id=\"modal\">\n    <div class=\"modal-title\" id=\"modal-title\">Add Competency<\u002Fdiv>\n    <input type=\"hidden\" id=\"edit-id\" value=\"\">\n    <div class=\"form-row\">\n      <label class=\"form-label\">Competency Name<\u002Flabel>\n      <input type=\"text\" class=\"form-input\" id=\"f-name\" placeholder=\"e.g. CCI 1 or CAIT 3\">\n    <\u002Fdiv>\n    <div class=\"form-row form-2col\">\n      <div>\n        <label class=\"form-label\">Domain<\u002Flabel>\n        <select class=\"form-input\" id=\"f-subject\">\n          <option>Communication<\u002Foption>\n          <option>Collaboration<\u002Foption>\n          <option>Information Skills<\u002Foption>\n          <option>Crit [\"Informed Decisions\"] },\n  ],\n  'P6-CFU3': [\n    { q:'1', page:94, sec:'A', text:'Identify which option is not an effect of a force', skills:[] },\n    { q:'2', page:94, sec:'A', text:'Identify which moving objects have gravitational force acting on them', skills:[\"Analysing Data\"] },\n    { q:'3', page:95, sec:'A', text:'Deduce the identity of objects B and C from changes in spring length', skills:[\"Analysing Data\"] },\n    { q:'4', page:96, sec:'A', text:'Identify the directions of magnetic and frictional force on an iron bar', skills:[\"Using Models\"] },\n    { q:'5', page:97, sec:'A', text:'Interpret a graph of pulling force to compare roughness of four surfaces', skills:[\"Analysing Data\"] },\n    { q:'6a', page:98, sec:'B', text:'State the force that caused the ball to fall', skills:[] },\n    { q:'6b', page:98, sec:'B', text:'State one other variable to keep the same in the experiment', skills:[\"Designing Investigations\"] },\n    { q:'6c', page:98, sec:'B', text:'Explain the relationship between ball mass and depth the pin was pushed', skills:[\"Analysing Data\", \"Communicating with Evidence\"] },\n    { q:'7a', page:100, sec:'B', text:'State the relationship between object mass and spring compression', skills:[\"Analysing Data\"] },\n    { q:'7b', page:100, sec:'B', text:'State the forces acting on the block at point Q', skills:[\"Using Models\"] },\n    { q:'7c', page:100, sec:'B', text:'Predict whether spring B pushes the block further, explaining using the graph', skills:[\"Analysing Data\", \"Communicating with Evidence\"] },\n  ],\n  'P6-CFU5': [\n    { q:'1', page:128, sec:'A', text:'Identify communities and populations from a diagram of organisms on a tree', skills:[\"Analysing Data\"] },\n    { q:'2', page:129, sec:'A', text:'Count producers and consumers in a food web', skills:[\"Using Models\", \"Analysing Data\"] },\n    { q:'3', page:129, sec:'A', text:'Identify the true statement about predator/prey roles in a food web', skills:[\"Using Models\", \"Analysing Data\"] },\n    { q:'4', page:129, sec:'A', text:'Choose the bird foot most likely adapted for swimming', skills:[\"Analysing Data\"] },\n    { q:'5a', page:130, sec:'B', text:'Explain why no plants grow at the bottom of the pond', skills:[\"Communicating with Evidence\"] },\n    { q:'5b', page:130, sec:'B', text:'Explain why water lilies do not grow well in fast-moving rivers', skills:[\"Communicating with Evidence\"] },\n    { q:'6a', page:131, sec:'B', text:'Explain why the water samples were left near the window', skills:[\"Designing Investigations\"] },\n    { q:'6b', page:131, sec:'B', text:'Use the duckweed graph to judge which part of the river is more polluted', skills:[\"Analysing Data\", \"Communicating with Evidence\"] },\n  ],\n};\n\nfunction cfuQuestions(actId){ return CFU_QUESTIONS[actId]||null; }\n// skills a CFU worksheet covers, rolled up from its questions (with counts)\n// renders the expandable per-question list for a CFU worksheet\nfunction renderCfuQuestions(actId, open){\n  const qs=cfuQuestions(actId); if(!qs) return '';\n  const roll=cfuSkillRollup(actId);\n  const secA=qs.filter(q=>q.sec==='A'), secB=qs.filter(q=>q.sec==='B');\n  const row=q=>{\n    const chips=q.skills.length\n      ? q.skills.map(n=>{const w=wotdByName(n);return `<span onclick=\"event.stopPropagation();setWotdFilter('${n}')\" style=\"font-size:9px;font-weight:600;color:${wotdCol(w)};background:${w.color}18;border:1px solid ${w.color}4d;border-radius:7px;padding:0 6px;cursor:pointer;white-space:nowrap;\">${n}<\u002Fspan>`;}).join('')\n      : `<span style=\"font-size:9px;color:var(--text-faint);border:1px solid var(--line);border-radius:7px;padding:0 6px;\">recall only<\u002Fspan>`;\n    return `<div style=\"display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);\">\n      <span style=\"font-size:11px;font-weight:800;color:var(--cyan);min-width:26px;\">Q${q.q}<\u002Fspan>\n      <div style=\"flex:1;min-width:0;\">\n        <div style=\"font-size:11.5px;color:var(--text-mid);line-height:1.5;\">${q.text}<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:3px;margin-top:4px;\">${chips}<\u002Fdiv>\n      <\u002Fdiv>\n      <span onclick=\"event.stopPropagation();openPdfModal('${actId}',${q.page})\" title=\"Open page ${q.page}\"\n        style=\"font-size:10px;color:var(--text-faint);cursor:pointer;white-space:nowrap;\">p${q.page}<\u002Fspan>\n    <\u002Fdiv>`;\n  };\n  const nSkilled=qs.filter(q=>q.skills.length).length;\n  return `\n    <div style=\"display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;\">\n      ${roll.map(x=>`<span onclick=\"setWotdFilter('${x.w.name}')\" title=\"${x.w.full}\"\n        style=\"font-size:10px;font-weight:600;color:${wotdCol(x.w)};background:${x.w.color}18;border:1px solid ${x.w.color}55;border-radius:9px;padding:1px 8px;cursor:pointer;\">\n        ${x.w.name} <span style=\"opacity:.7;\">${x.n}<\u002Fspan><\u002Fspan>`).join('')}\n    <\u002Fdiv>\n    <div style=\"font-size:10.5px;color:var(--text-faint);margin-bottom:6px;\">\n      ${qs.length} questions · ${nSkilled} test a process skill · ${qs.length-nSkilled} recall only\n    <\u002Fdiv>\n    <div onclick=\"toggleCfuList('${actId}')\" style=\"cursor:pointer;font-size:11px;color:var(--cyan);user-select:none;\">\n      <span id=\"cfu-arrow-${actId}\">${open?'▼':'▶'}<\u002Fspan> Question breakdown\n    <\u002Fdiv>\n    <div id=\"cfu-list-${actId}\" style=\"display:${open?'block':'none'};margin-top:6px;\">\n      ${secA.length?`<div style=\"font-size:9.5px;font-weight:800;letter-spacing:.1em;color:var(--text-faint);margin:6px 0 2px;\">SECTION A · MULTIPLE CHOICE<\u002Fdiv>`:''}\n      ${secA.map(row).join('')}\n      ${secB.length?`<div style=\"font-size:9.5px;font-weight:800;letter-spacing:.1em;color:var(--text-faint);margin:10px 0 2px;\">SECTION B · STRUCTURED<\u002Fdiv>`:''}\n      ${secB.map(row).join('')}\n    <\u002Fdiv>`;\n}\nwindow.toggleCfuList=function(actId){\n  const el=document.getElementById('cfu-list-'+actId), ar=document.getElementById('cfu-arrow-'+actId);\n  if(!el) return;\n  const open=el.style.display==='none';\n  el.style.display=open?'block':'none';\n  if(ar) ar.textContent=open?'▼':'▶';\n};\n\nfunction cfuSkillRollup(actId){\n  const qs=cfuQuestions(actId); if(!qs) return [];\n  const c={};\n  qs.forEach(q=>q.skills.forEach(s=>c[s]=(c[s]||0)+1));\n  return Object.entries(c).sort((a,b)=>b[1]-a[1])\n    .map(([name,n])=>({w:wotdByName(name), n}))\n    .filter(x=>x.w);\n}\n\n\n// ---- WOTD filter state ----\nlet activeWotd = null;\nfunction setWotdFilter(name){\n  activeWotd = (activeWotd===name) ? null : name;\n  renderWotdList();\n  applyWotdHighlight();\n}\nwindow.setWotdFilter=setWotdFilter;\nwindow.clearWotdFilter=function(){ activeWotd=null; renderWotdList(); applyWotdHighlight(); };\n\nfunction wotdCompetencyIds(name){\n  const w=wotdByName(name); if(!w) return new Set();\n  const acts=new Set(w.activities);\n  return new Set(teachers.filter(t=>t.projects.some(p=>acts.has(p))).map(t=>t.id));\n}\nfunction wotdNodeIds(name){\n  if(viewMode==='wotd')     return new Set(teachers.filter(t=>t.wotdName===name).map(t=>t.id));\n  if(viewMode==='activity') return new Set(teachers.filter(t=>actWotdNames(t.actId).includes(name)).map(t=>t.id));\n  return wotdCompetencyIds(name);\n}\nfunction applyWotdHighlight(){\n  if(!activeWotd){\n    if(focusedId) focusTeacher(focusedId); else if(activeActivity) applyActivityHighlight(); else clearFocus();\n    return;\n  }\n  const ids=wotdNodeIds(activeWotd);\n  nodeMeshes.forEach(({mesh,teacher:t})=>{\n    const on=ids.has(t.id);\n    mesh.material.opacity=on?1:.05;\n    mesh.material.emissiveIntensity=on?1.15:.02;\n  });\n  edgeLines.forEach(l=>{\n    l.material.opacity=(ids.has(l.userData.t1)&&ids.has(l.userData.t2))?.65:.01;\n  });\n  labelEls.forEach(({el,teacher:t})=>{ el.style.opacity=ids.has(t.id)?'1':'.06'; });\n}\nfunction renderWotdList(){\n  const el=document.getElementById('wotd-list'); if(!el) return;\n  el.innerHTML=WOTD.map(w=>{\n    const n=w.activities.length;\n    const on=activeWotd===w.name;\n    return `<div onclick=\"setWotdFilter('${w.name}')\" title=\"${w.full}\"\n      style=\"display:flex;align-items:center;gap:6px;padding:4px 7px;margin-bottom:3px;border-radius:6px;cursor:pointer;\n             background:${on?w.color+'26':'transparent'};border:1px solid ${on?w.color+'88':'transparent'};transition:all .15s;\">\n      <span style=\"width:8px;height:8px;border-radius:50%;background:${w.color};box-shadow:0 0 5px ${w.color};flex-shrink:0;\"><\u002Fspan>\n      <span style=\"flex:1;font-size:11px;color:${on?wotdCol(w):'var(--text-mid)'};font-weight:${on?'700':'400'};line-height:1.3;\">${w.name}<\u002Fspan>\n      <span style=\"font-size:10px;color:var(--text-faint);\">${n}<\u002Fspan>\n    <\u002Fdiv>`;\n  }).join('') + (activeWotd\n    ? `<button onclick=\"clearWotdFilter()\" style=\"width:100%;margin-top:4px;padding:4px;background:none;border:1px solid var(--line);color:var(--text-dim);border-radius:5px;cursor:pointer;font-size:10px;font-family:inherit;\">✕ Clear skill filter<\u002Fbutton>`\n    : '');\n}\nwindow.renderWotdList=renderWotdList;\n\n// ================================================================\n// WOTD TAG EDITOR\n// ================================================================\nlet wotdEditAct=null, wotdEditSel=new Set();\nfunction openWotdEditor(actId){\n  const a=getAct(actId); if(!a) return;\n  wotdEditAct=actId;\n  wotdEditSel=new Set(actWotdNames(actId));\n  document.getElementById('wotd-edit-title').textContent=`${a.level} ${a.code} — ${a.name}`;\n  document.getElementById('wotd-edit-sub').textContent=`${a.chapter} · page ${actPage(actId)}`;\n  renderWotdEditor();\n  document.getElementById('wotd-modal').style.display='flex';\n}\nwindow.openWotdEditor=openWotdEditor;\nwindow.closeWotdEditor=function(){ document.getElementById('wotd-modal').style.display='none'; wotdEditAct=null; };\n\nfunction renderWotdEditor(){\n  const el=document.getElementById('wotd-edit-list');\n  const dflt=new Set((WOTD_BY_ACT[wotdEditAct]||[]).map(w=>w.name));\n  el.innerHTML=WOTD.map(w=>{\n    const on=wotdEditSel.has(w.name);\n    const wasDefault=dflt.has(w.name);\n    const note=wotdNote(wotdEditAct,w.name);\n    return `<div class=\"wt-row ${on?'on':''}\" onclick=\"toggleWotdSel('${w.name}')\" style=\"border-color:${on?w.color+'88':'var(--line)'};\">\n      <div class=\"wt-check\" style=\"background:${on?w.color:'transparent'};border-color:${on?w.color:'var(--line-strong)'};\">${on?'✓':''}<\u002Fdiv>\n      <div style=\"flex:1;min-width:0;\">\n        <div style=\"font-size:12.5px;font-weight:600;color:${on?wotdCol(w):'var(--text-mid)'};\">${w.name}<\u002Fdiv>\n        <div style=\"font-size:10.5px;color:var(--text-faint);line-height:1.45;\">${w.full}<\u002Fdiv>\n        ${note?`<div style=\"font-size:10px;color:var(--text-dim);margin-top:3px;font-style:italic;\">${note}<\u002Fdiv>`:''}\n      <\u002Fdiv>\n      ${wasDefault?`<span title=\"In the syllabus mapping\" style=\"font-size:9px;color:var(--text-faint);border:1px solid var(--line);border-radius:8px;padding:1px 6px;flex-shrink:0;\">syllabus<\u002Fspan>`:''}\n    <\u002Fdiv>`;\n  }).join('');\n  const changed = JSON.stringify([...wotdEditSel].sort())!==JSON.stringify([...dflt].sort());\n  document.getElementById('wotd-edit-note').innerHTML = changed\n    ? '<span style=\"color:#ffaa33;\">● Differs from the syllabus mapping. Saving records your version.<\u002Fspan>'\n    : 'Matches the syllabus mapping.';\n}\nwindow.toggleWotdSel=function(n){\n  wotdEditSel.has(n)?wotdEditSel.delete(n):wotdEditSel.add(n);\n  renderWotdEditor();\n};\nwindow.saveWotdEditor=function(){\n  const dflt=(WOTD_BY_ACT[wotdEditAct]||[]).map(w=>w.name).sort();\n  const sel=[...wotdEditSel].sort();\n  if(JSON.stringify(sel)===JSON.stringify(dflt)) delete wotdOverrides[wotdEditAct];\n  else wotdOverrides[wotdEditAct]=sel;\n  saveWotdOverrides();\n  closeWotdEditor();\n  refreshAfterWotdEdit();\n};\nwindow.resetWotdForActivity=function(){\n  if(!wotdEditAct) return;\n  delete wotdOverrides[wotdEditAct]; saveWotdOverrides();\n  closeWotdEditor(); refreshAfterWotdEdit();\n};\nfunction refreshAfterWotdEdit(){\n  if(viewMode!=='competency'){       // node sets depend on the tags\n    const keep=focusedId;\n    teachers=buildViewNodes(viewMode); teachers.forEach(initPhysics);\n    buildScene();\n    if(keep && teachers.some(t=>t.id===keep)) focusTeacher(keep);\n  } else if(focusedId) focusTeacher(focusedId);\n  renderWotdList();\n}\nwindow.resetAllWotd=function(){\n  if(!confirm('Reset every edited process-skill tag back to the syllabus mapping?')) return;\n  wotdOverrides={}; saveWotdOverrides(); refreshAfterWotdEdit();\n  alert('All process-skill tags reset.');\n};\n\nfunction actLabel(id){ const a=getAct(id); return a ? `${a.level} ${a.code} — ${a.name}` : id; }\nfunction actShort(id){ const a=getAct(id); return a ? a.name : id; }\n\n// ---------------- COMPETENCIES ----------------\nconst COMPETENCIES = [\n  { id:1, name:'Communicates Ideas', code:'CCI 1', core:true, desc:'Effectively communicates information and co-constructs meaning',\n    subject:'Communication', role:'CCI 1 CORE',\n    projects:[\"P3-1.1\", \"P3-2.1A\", \"P3-3.7\", \"P3-5.2\", \"P3-CFU2\", \"P4-1.2\", \"P4-2.1\", \"P4-2.2A\", \"P4-3.2\", \"P4-5.5\", \"P4-CFU2\", \"P5-1.6\", \"P5-2.5\", \"P5-4.5\", \"P5-4.6\", \"P5-3.5\", \"P6-1.2\", \"P6-2.1\", \"P6-3.1\", \"P6-4.4\"],\n    tags:[\"CORE\", \"Comms & Collab\", \"Communication\", \"Lower P1.1\", \"Upper P1.2\", \"Evidence-Based\"] },\n  { id:2, name:'Listens with Empathy', code:'CCI 2', core:true, desc:'Engages empathetically with diverse perspectives',\n    subject:'Communication', role:'CCI 2 CORE',\n    projects:[\"P3-1.3\", \"P3-2.3\", \"P4-2.3\", \"P4-1.4\", \"P5-2.6\", \"P5-2.7\", \"P5-6.5\", \"P6-1.5\", \"P6-5.2\", \"P6-5.3\"],\n    tags:[\"CORE\", \"Comms & Collab\", \"Communication\", \"Lower P2.1\" laces the\n// syllabus default for that activity.\nlet wotdOverrides = loadJSON('scienceMapWotdOverrides', {});\nfunction actWotdNames(id){\n  if(wotdOverrides[id]) return wotdOverrides[id].slice();\n  const base=(WOTD_BY_ACT[id]||[]).map(w=>w.name);\n  if(base.length) return base;\n  // Check-for-Understanding sheets are tagged at question level — roll those up\n  const roll=cfuSkillRollup(id);\n  return roll.map(x=>x.w.name);\n}\nfunction actWotdEdited(id){ return wotdOverrides[id]!==undefined; }\nfunction saveWotdOverrides(){ Store.set('scienceMapWotdOverrides', JSON.stringify(wotdOverrides)); }\n\n// ================================================================\n// VIEW MODES\n// ================================================================\nlet viewMode = 'competency';   // 'competency' | 'activity' | 'wotd'\nconst VIEW_LABEL = { competency:'21st CC Competencies', activity:'Primary Level — Activities', wotd:'Ways of Thinking & Doing' };\n\n// extra colour keys so getCol() works for the new node types\nCOLOURS['P3']={hex:0x33cc77,css:'#33cc77'}; COLOURS_DAY['P3']='#1c7d47';\nCOLOURS['P4']={hex:0x4488ff,css:'#4488ff'}; COLOURS_DAY['P4']='#005dff';\nCOLOURS['P5']={hex:0xffaa33,css:'#ffaa33'}; COLOURS_DAY['P5']='#9f5d00';\nCOLOURS['P6']={hex:0xff4455,css:'#ff4455'}; COLOURS_DAY['P6']='#dc0014';\nWOTD.forEach(w=>{\n  COLOURS[w.name]={hex:parseInt(w.color.slice(1),16), css:w.color};\n  COLOURS_DAY[w.name]=w.colorDay;\n  TIER_DAY[w.name]=w.colorDay;\n});\nTIER_DAY['Primary 3']='#1c7d47'; TIER_DAY['Primary 4']='#005dff';\nTIER_DAY['Primary 5']='#9f5d00'; TIER_DAY['Primary 6']='#dc0014';\n\n// competency names that use a given activity\nfunction actCompetencies(id){ return COMPETENCIES.filter(c=>c.projects.includes(id)); }\n\nfunction buildViewNodes(mode){\n  if(mode==='competency'){\n    return COMPETENCIES.map(c=>({ ...c, kind:'competency' }));\n  }\n  if(mode==='activity'){\n    // one node per activity that is used by at least one competency or skill\n    return ACTIVITIES.map((a,i)=>{\n      const comps=actCompetencies(a.id).map(c=>c.name);\n      const skills=actWotdNames(a.id);\n      return {\n        id: 1000+i, kind:'activity', actId:a.id, code:a.code,\n        name: a.name,\n        desc: `${a.level} · Activity ${a.code} · ${a.chapter} · page ${actPage(a.id)}`,\n        subject: a.level,\n        role: a.level,\n        // shared competency OR shared skill creates an edge\n        projects: comps.concat(skills),\n        tags: [a.level, a.chapter].concat(skills),\n      };\n    });\n  }\n  // wotd\n  return WOTD.map((w,i)=>{\n    const acts=WOTD.find(x=>x.name===w.name).activities.slice();\n    // include any activities the teacher has re-tagged into this skill\n    Object.entries(wotdOverrides).forEach(([aid,names])=>{\n      if(names.includes(w.name) && !acts.includes(aid)) acts.push(aid);\n    });\n    const live=acts.filter(aid=>actWotdNames(aid).includes(w.name));\n    const levels=[...new Set(live.map(a=>a.split('-')[0]))].sort();\n    return {\n      id: 2000+i, kind:'wotd', wotdName:w.name,\n      name: w.name,\n      desc: w.full,\n      subject: w.name,\n      role: w.name,\n      projects: live,                       // shared activities create edges\n      tags: levels.concat(['Process Skill']),\n    };\n  });\n}\n\nfunction setViewMode(mode){\n  if(!VIEW_LABEL[mode]) return;\n  viewMode = mode;\n  TIERS = mode==='competency' ? TIERS_COMPETENCY : (mode==='activity' ? TIERS_ACTIVITY : TIERS_WOTD);\n  teachers = buildViewNodes(mode);\n  teachers.forEach(initPhysics);\n    activeTagFilters.clear();\n  activeActivity=null; document.getElementById('activity-bar').classList.remove('show');\n  activeWotd=null;\n  focusedId=null;\n  document.getElementById('info-panel').classList.remove('open');\n  simRunning=true; simFrame=0;\n  document.querySelectorAll('.view-tab').forEach(el=>el.classList.toggle('on', el.dataset.mode===mode));\n  const isComp = mode==='competency';\n  document.getElementById('add-btn').style.display = isComp?'block':'none';\n  document.getElementById('hier-sidebar').style.display='block';\n  document.querySelector('#legend').parentElement.querySelector('.section-label').textContent =\n    mode==='activity' ? 'Primary Level' : (mode==='wotd' ? 'Process Skill' : 'Domain Colour');\n  buildHierarchyLabels(); buildScene(); updateLegend(); updateTagFilters(); updateTagPointsUI(); updateCount();\n  if(typeof renderWotdList==='function') renderWotdList();\n}\nwindow.setViewMode=setViewMode;\n\n\nfunction initPhysics(t){\n  if(!isFinite(t.x)||!isFinite(t.y)||!isFinite(t.z)){\n    const a=Math.random()*Math.PI*2, r=45+Math.random()*25;\n    t.x=Math.cos(a)*r+(Math.random()-.5)*15;\n    t.y=getTierY(getRank(t.role))+(Math.random()-.5)*15;\n    t.z=Math.sin(a)*r+(Math.random()-.5)*15;\n    t.vx=t.vy=t.vz=0;\n  }\n}\nteachers.forEach(initPhysics);\n\n// ================================================================\n// TAG POINTS  (default 1 pt per tag)\n// ================================================================\nlet tagPoints = {};\nfunction getTagPts(tag){ return Math.max(0, tagPoints[tag]??1); }\nfunction getTotalPts(t){ return t.tags.reduce((s,tg)=>s+getTagPts(tg),0); }\nfunction getMaxPts(){ return Math.max(1,...teachers.map(t=>getTotalPts(t))); }\nfunction getNodeR(t){\n  const pts=getTotalPts(t);\n  return 2.2 + Math.sqrt(Math.max(0,pts)) * 2.1;\n}\n\n// ================================================================\n// EDGE LOGIC\n// ================================================================\nfunction normaliseCat(role){\n  if(/CCI [12]|comm/i.test(role))      return 'cci-comm';\n  if(/CCI [34]|collab/i.test(role))    return 'cci-collab';\n  if(/CCI [56]|info/i.test(role))      return 'cci-info';\n  if(/CAIT [12]|critical/i.test(role)) return 'cait-crit';\n  if(/CAIT [34]|adaptive/i.test(role)) return 'cait-adapt';\n  if(/CAIT [56]|inventive/i.test(role))return 'cait-invent';\n  if(/CGC.*[12]|civic/i.test(role))    return 'cgc-civic';\n  if(/CGC.*[34]|global/i.test(role))   return 'cgc-global';\n  if(/CGC.*[56]|cross/i.test(role))    return 'cgc-cross';\n  return role.trim();\n}\nfunction getCCType(role){\n  if(/^CCI/i.test(role))  return 'CCI';\n  if(/^CAIT/i.test(role)) return 'CAIT';\n  if(/^CGC/i.test(role))  return 'CGC';\n  return null;\n}\n\nfunction getEdgeStyle(t1, t2){\n  if(viewMode==='activity'){\n    // 145 activities would otherwise produce thousands of lines — keep only\n    // the meaningful overlaps.\n    const shared=t1.projects.filter(p=>t2.projects.includes(p));\n    if(shared.length<2) return null;\n    const comps=shared.filter(x=>/^(CCI|CAIT|CGC)/.test(x)).length;\n    if(comps>=2)          return {color:0x88ffbb, opacity:0.50, type:'competency'};\n    if(shared.length>=3)  return {color:0x33ddff, opacity:0.30, type:'skill'};\n    return null;\n  }\n  if(viewMode==='wotd'){\n    const shared=t1.projects.filter(p=>t2.projects.includes(p));\n    if(!shared.length) return null;\n    const o=Math.min(0.75, 0.18+shared.length*0.03);\n    return {color: shared.length>=8?0x88ffbb:0x33ddff, opacity:o, type:'shared'};\n  }\n  const sharedAct = t1.projects.filter(p=>t2.projects.includes(p));\n  const sameDomain = t1.subject===t2.subject;\n  const sameCat = normaliseCat(t1.role)===normaliseCat(t2.role);\n  const sameCCType = getCCType(t1.role)===getCCType(t2.role) && getCCType(t1.role)!==null;\n  const hasAct = sharedAct.length>0;\n\n  if(hasAct && sameCat)  return {color:0x88ffbb, opacity:0.72, type:'both'};\n  if(hasAct)             return {color:0x33ddff, opacity:0.60, type:'activity'};\n  if(sameCat)            return {color:0xffcc33, opacity:0.54, type:'category'};\n  if(sameCCType)         return {color:getCol(t1.subject).hex, opacity:0.16, type:'cctype'};\n  return null;\n}\n\n// ================================================================\n// THREE.JS SETUP\n// ================================================================\nconst canvas = document.getElementById('canvas');\nconst scene = new THREE.Scene();\nscene.fog = new THREE.FogExp2(0x070b18, 0.005);\n\nconst camera = new THREE.PerspectiveCamera(60,1,0.1,2000);\nconst orbit = {theta:0, phi:Math.PI/2, r:200};\nlet panX=0, panY=0;\n\nconst renderer = new THREE.WebGLRenderer({canvas,antialias:true});\nrenderer.setPixelRatio(Math.min(window.devicePixelRatio,2));\nrenderer.setClearColor(0x070b18,1);\n\nfunction resize(){\n  const w=Math.max(1,window.innerWidth-220), h=window.innerHeight;\n  renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix();\n}\nresize();\nwindow.addEventListener('resize',resize);\n\nscene.add(new THREE.AmbientLight(0x334477,2.2));\nconst pl1=new THREE.PointLight(0x5577ff,3.5,700); pl1.position.set(0,160,120); scene.add(pl1);\nconst pl2=new THREE.PointLight(0x33cc77,1.8,500); pl2.position.set(-120,-60,-90); scene.add(pl2);\n\nconst sGeo=new THREE.BufferGeometry();\nconst sPos=new Float32Array(280*3);\nfor(let i=0;i<280;i++){sPos[i*3]=(Math.random()-.5)*800;sPos[i*3+1]=(Math.random()-.5)*800;sPos[i*3+2]=(Math.random()-.5)*800;}\nsGeo.setAttribute('position',new THREE.BufferAttribute(sPos,3));\nscene.add(new THREE.Points(sGeo,new THREE.PointsMaterial({color:0x334466,size:0.9,transparent:true,opacity:0.4})));\n\nfunction applyOrbit(){\n  camera.position.x=panX+orbit.r*Math.sin(orbit.phi)*Math.sin(orbit.theta);\n  camera.position.y=panY+orbit.r*Math.cos(orbit.phi);\n  camera.position.z=orbit.r*Math.sin(orbit.phi)*Math.cos(orbit.theta);\n  camera.lookAt(panX,panY,0);\n}\napplyOrbit();\n\nlet isDragging=false, prevMouse={x:0,y:0}, wasDragging=false;\nlet autoRotate=false;\nlet groupBy='hierarchy';\n\ncanvas.addEventListener('mousedown',e=>{isDragging=true;wasDragging=false;prevMouse={x:e.clientX,y:e.clientY};});\nwindow.addEventListener('mouseup',()=>{isDragging=false;});\nwindow.addEventListener('mousemove',e=>{\n  if(!isDragging)return;\n  const dx=e.clientX-prevMouse.x,dy=e.clientY-prevMouse.y;\n  if(Math.abs(dx)>3||Math.abs(dy)>3){wasDragging=true;autoRotate=false;}\n  if(e.buttons&1){orbit.theta-=dx*0.006;orbit.phi=Math.max(0.15,Math.min(Math.PI-.15,orbit.phi-dy*0.006));}\n  else if(e.buttons&4){panX-=dx*0.14;panY+=dy*0.14;}\n  prevMouse={x:e.clientX,y:e.clientY};\n  applyOrbit();\n});\ncanvas.addEventListener('wheel',e=>{orbit.r=Math.max(60,Math.min(700,orbit.r+e.deltaY*0.3));applyOrbit();},{passive:true});\n\nlet activeTagFilters=new Set();\nlet searchQuery='';\nlet focusedId=null;\nlet simRunning=true, simFrame=0;\nlet nodeMeshes=[], edgeLines=[], labelEls=[];\n\nfunction getVisible(){\n  return teachers.filter(t=>{\n    if(searchQuery){\n      const hay = (t.name+' '+t.subject+' '+(t.desc||'')+' '+t.tags.join(' ')+' '+\n                   t.projects.map(id=>{const a=getAct(id);return a?a.name+' '+a.code+' '+a.level+' '+a.chapter:id;}).join(' ')\n                  ).toLowerCase();\n      if(!hay.includes(searchQuery)) return false;\n    }\n    if(activeTagFilters.size>0 && !t.tags.some(tg=>activeTagFilters.has(tg))) return false;\n    return true;\n  });\n}\nfunction getConnections(t){\n  const vIds=new Set(getVisible().map(v=>v.id));\n  return teachers.filter(o=>o.id!==t.id&&vIds.has(o.id)&&getEdgeStyle(t,o)!==null);\n}\n\n// ================================================================\n// BUILD SCENE\n// ================================================================\nfunction buildScene(){\n  nodeMeshes.forEach(n=>scene.remove(n.mesh));\n  edgeLines.forEach(l=>scene.remove(l));\n  labelEls.forEach(e=>e.el.remove());\n  nodeMeshes=[]; edgeLines=[]; labelEls=[];\n\n  const visible=getVisible();\n  const seen=new Set();\n  visible.forEach(t1=>{\n    visible.forEach(t2=>{\n      if(t2.id<=t1.id) return;\n      const key=t1.id+'-'+t2.id;\n      if(seen.has(key)) return; seen.add(key);\n      const style=getEdgeStyle(t1,t2);\n      if(!style) return;\n      const pts=[new THREE.Vector3(t1.x,t1.y,t1.z),new THREE.Vector3(t2.x,t2.y,t2.z)];\n      const geo=new THREE.BufferGeometry().setFromPoints(pts);\n      const mat=new THREE.LineBasicMaterial({color:style.color,transparent:true,opacity:style.opacity});\n      const line=new THREE.Line(geo,mat);\n      line.userData={t1:t1.id,t2:t2.id};\n      scene.add(line); edgeLines.push(line);\n    });\n  });\n\n  visible.forEach(t=>{\n    const r=getNodeR(t);\n    const col=getCol(t.subject);\n    const geo=new THREE.SphereGeometry(r,22,22);\n    const mat=new THREE.MeshPhongMaterial({color:col.hex,emissive:col.hex,emissiveIntensity:0.42,shininess:90,transparent:true,opacity:1});\n    const mesh=new THREE.Mesh(geo,mat);\n    mesh.position.set(t.x,t.y,t.z);\n    mesh.userData.id=t.id;\n    scene.add(mesh);\n    const hGeo=new THREE.RingGeometry(r*1.4,r*2.0,36);\n    const hMat=new THREE.MeshBasicMaterial({color:col.hex,transparent:true,opacity:0.12,side:THREE.DoubleSide});\n    mesh.add(new THREE.Mesh(hGeo,hMat));\n    nodeMeshes.push({mesh,teacher:t,baseR:r});\n\n    const el=document.createElement('div');\n    el.className='node-label';\n    el.textContent = (t.kind==='activity' && t.code) ? t.code+'  '+t.name : t.name;\n    document.body.appendChild(el);\n    labelEls.push({el,mesh,teacher:t});\n  });\n\n  buildHierarchyLabels();\n  updateLegend();\n  updateTagFilters();\n  updateTagPointsUI();\n  updateCount();\n  if(typeof layout!=='undefined' && layout==='board'){\n    labelEls.forEach(({el})=>{ el.style.visibility='hidden'; });\n    renderBoard();\n  }\n}\n\n// ================================================================\n// FORCE SIMULATION\n// ================================================================\nconst SIM={repulsion:1400,attraction:0.04,damping:0.82,idealDist:36,centerPull:0.007,groupPull:0.016,hierY:0.09};\n\nfunction getRoleAnchor(role){\n  const roles=[...new Set(teachers.map(t=>t.role))];\n  const i=roles.indexOf(role),n=Math.max(1,roles.length);\n  const a=(i/n)*Math.PI*2;\n  return{x:Math.cos(a)*70,y:Math.sin(a)*38,z:Math.sin(a*1.3)*28};\n}\n\nfunction simulate(){\n  if(!simRunning) return;\n  simFrame++;\n  const vIds=new Set(getVisible().map(t=>t.id));\n  teachers.forEach(t1=>{\n    if(!vIds.has(t1.id)) return;\n    let fx=0,fy=0,fz=0;\n    teachers.forEach(t2=>{\n      if(t2.id===t1.id||!vIds.has(t2.id)) return;\n      const dx=t1.x-t2.x,dy=t1.y-t2.y,dz=t1.z-t2.z;\n      const d2=dx*dx+dy*dy+dz*dz+1,d=Math.sqrt(d2),f=SIM.repulsion/d2;\n      fx+=dx/d*f;fy+=dy/d*f;fz+=dz/d*f;\n    });\n    getConnections(t1).forEach(t2=>{\n      const dx=t2.x-t1.x,dy=t2.y-t1.y,dz=t2.z-t1.z;\n      const d=Math.sqrt(dx*dx+dy*dy+dz*dz)+.01,s=d-SIM.idealDist;\n      fx+=dx/d*s*SIM.attraction;fy+=dy/d*s*SIM.attraction;fz+=dz/d*s*SIM.attraction;\n    });\n    fx-=t1.x*SIM.centerPull;fy-=t1.y*SIM.centerPull;fz-=t1.z*SIM.centerPull;\n    if(groupBy==='subject'){\n      const a=SUBJECT_ANCHORS[t1.subject];\n      if(a){fx+=(a.x-t1.x)*SIM.groupPull;fy+=(a.y-t1.y)*SIM.groupPull;fz+=(a.z-t1.z)*SIM.groupPull;}\n    } else if(groupBy==='role'){\n      const a=getRoleAnchor(t1.role);\n      fx+=(a.x-t1.x)*SIM.groupPull;fy+=(a.y-t1.y)*SIM.groupPull;fz+=(a.z-t1.z)*SIM.groupPull;\n    } else if(groupBy==='hierarchy'){\n      const targetY=getTierY(getRank(t1.role));\n      fy+=(targetY-t1.y)*SIM.hierY;\n      fx-=t1.x*0.004; fz-=t1.z*0.004;\n    }\n    t1.vx=(t1.vx+fx)*SIM.damping;\n    t1.vy=(t1.vy+fy)*SIM.damping;\n    t1.vz=(t1.vz+fz)*SIM.damping;\n  });\n  teachers.forEach(t=>{\n    if(!vIds.has(t.id)) return;\n    t.x+=t.vx;t.y+=t.vy;t.z+=t.vz;\n    if(!isFinite(t.x)||!isFinite(t.y)||!isFinite(t.z)){ t.x=t.y=t.z=undefined; initPhysics(t); }\n  });\n  if(simFrame>500){\n    const e=teachers.reduce((s,t)=>s+t.vx*t.vx+t.vy*t.vy+t.vz*t.vz,0);\n    if(e<0.08) simRunning=false;\n  }\n}\n\nfunction updatePositions(){\n  nodeMeshes.forEach(({mesh,teacher:t})=>mesh.position.set(t.x,t.y,t.z));\n  edgeLines.forEach(line=>{\n    const t1=teachers.find(t=>t.id===line.userData.t1);\n    const t2=teachers.find(t=>t.id===line.userData.t2);\n    if(!t1||!t2) return;\n    const p=line.geometry.att
